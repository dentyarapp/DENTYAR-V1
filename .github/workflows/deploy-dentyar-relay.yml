name: Deploy DENTYAR Firebase Relay

on:
  workflow_dispatch:
  push:
    branches:
      - fix/dentyar-v100-sync-transport-20261016
    paths:
      - "cloudflare/dentyar-sync-relay.js"
      - ".github/workflows/deploy-dentyar-relay.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out relay source
        uses: actions/checkout@v4
        with:
          ref: fix/dentyar-v100-sync-transport-20261016

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }
          npx --yes wrangler@4 deploy cloudflare/dentyar-sync-relay.js \
            --name dentyar-sync-relay \
            --compatibility-date 2026-10-16 \
            --account-id "$CLOUDFLARE_ACCOUNT_ID"
