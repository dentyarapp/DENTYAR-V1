name: Deploy DENTYAR Firebase Relay

on:
  workflow_dispatch:
  push:
    branches:
      - fix/dentyar-v100-sync-transport-20261016
    paths:
      - "cloudflare/dentyar-sync-relay.js"
      - ".github/workflows/deploy-dentyar-relay.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check whether deployment credentials are configured
        id: credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Relay source is ready, but deployment is skipped until CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets are configured."
          fi

      - name: Check out relay source
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          ref: fix/dentyar-v100-sync-transport-20261016

      - name: Set up Node.js
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy Cloudflare Worker
        if: steps.credentials.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 deploy cloudflare/dentyar-sync-relay.js \
            --name dentyar-sync-relay \
            --compatibility-date 2026-10-16
