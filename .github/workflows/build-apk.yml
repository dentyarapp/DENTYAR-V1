name: Build DENTYAR V59 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v4

      - name: نصب Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: آماده سازی پروژه
        run: |
          mkdir -p www
          cp DENTYAR_V59_NUMBERS_UNIFIED_FINAL.html www/index.html

          cat > package.json <<'EOF'
          {
            "name": "dentyar-v59",
            "version": "59.0.0",
            "private": true,
            "scripts": {
              "build": "echo DENTYAR V59"
            },
            "dependencies": {
              "@capacitor/core": "^7.4.3",
              "@capacitor/android": "^7.4.3",
              "@capacitor/cli": "^7.4.3",
              "@capacitor/filesystem": "^7.0.4",
              "@capacitor/share": "^7.0.4"
            }
          }
          EOF

          npm install

          npx cap init "دنتی‌یار" "com.dentyar.app" --web-dir www
          npx cap add android

      - name: افزودن Native Direct Export
        run: |
          mkdir -p android/app/src/main/java/com/dentyar/app

          cat > android/app/src/main/java/com/dentyar/app/DentyarNativePlugin.java <<'EOF'
          package com.dentyar.app;

          import android.content.ContentResolver;
          import android.content.ContentValues;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          import java.io.OutputStream;

          @CapacitorPlugin(name = "DentyarNative")
          public class DentyarNativePlugin extends Plugin {

              @PluginMethod
              public void saveToDownloads(PluginCall call) {

                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.Q) {
                      call.reject(
                          "Android 10 or newer is required for public Downloads export"
                      );
                      return;
                  }

                  String fileName = call.getString(
                      "filename",
                      "DENTYAR-report"
                  );

                  String mimeType = call.getString(
                      "mimeType",
                      "application/octet-stream"
                  );

                  String data = call.getString("data", "");

                  if (data == null || data.isEmpty()) {
                      call.reject("Empty report data");
                      return;
                  }

                  fileName = fileName.replaceAll(
                      "[\\\\/:*?\"<>|]",
                      "_"
                  );

                  ContentResolver resolver =
                      getContext().getContentResolver();

                  ContentValues values = new ContentValues();

                  values.put(
                      MediaStore.Downloads.DISPLAY_NAME,
                      fileName
                  );

                  values.put(
                      MediaStore.Downloads.MIME_TYPE,
                      mimeType
                  );

                  values.put(
                      MediaStore.Downloads.RELATIVE_PATH,
                      Environment.DIRECTORY_DOWNLOADS
                          + "/DENTYAR/Reports"
                  );

                  values.put(
                      MediaStore.Downloads.IS_PENDING,
                      1
                  );

                  Uri uri = null;

                  try {

                      uri = resolver.insert(
                          MediaStore.Downloads.EXTERNAL_CONTENT_URI,
                          values
                      );

                      if (uri == null) {
                          throw new Exception(
                              "MediaStore could not create the report file"
                          );
                      }

                      byte[] bytes = Base64.decode(
                          data,
                          Base64.DEFAULT
                      );

                      try (OutputStream out =
                               resolver.openOutputStream(uri)) {

                          if (out == null) {
                              throw new Exception(
                                  "Could not open report output stream"
                              );
                          }

                          out.write(bytes);
                          out.flush();
                      }

                      ContentValues done =
                          new ContentValues();

                      done.put(
                          MediaStore.Downloads.IS_PENDING,
                          0
                      );

                      resolver.update(
                          uri,
                          done,
                          null,
                          null
                      );

                      JSObject result =
                          new JSObject();

                      result.put(
                          "saved",
                          true
                      );

                      result.put(
                          "uri",
                          uri.toString()
                      );

                      result.put(
                          "path",
                          "Download/DENTYAR/Reports/"
                              + fileName
                      );

                      call.resolve(result);

                  } catch (Exception e) {

                      if (uri != null) {
                          try {
                              resolver.delete(
                                  uri,
                                  null,
                                  null
                              );
                          } catch (Exception ignored) {
                          }
                      }

                      call.reject(
                          "Direct export failed: "
                              + e.getMessage(),
                          e
                      );
                  }
              }
          }
          EOF

          cat > android/app/src/main/java/com/dentyar/app/MainActivity.java <<'EOF'
          package com.dentyar.app;

          import android.os.Bundle;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);

                  registerPlugin(
                      DentyarNativePlugin.class
                  );
              }
          }
          EOF

      - name: اتصال JavaScript به Native Direct
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("www/index.html")
          text = path.read_text(encoding="utf-8")

          start = text.find(
              "async function v31NativeFile("
          )

          if start < 0:
              raise SystemExit(
                  "ERROR: v31NativeFile was not found"
              )

          end = text.find(
              "\nasync function downloadBlob(",
              start
          )

          if end < 0:
              raise SystemExit(
                  "ERROR: downloadBlob boundary was not found"
              )

          new_function = r'''async function v31NativeFile(bytes, filename, mime, options={}){
            try{
              const C=window.Capacitor;

              if(
                !C ||
                typeof C.isNativePlatform!=='function' ||
                !C.isNativePlatform()
              ){
                return {
                  saved:false,
                  shared:false
                };
              }

              const arr =
                bytes instanceof Uint8Array
                  ? bytes
                  : new Uint8Array(bytes);

              let binary='';
              const chunk=0x8000;

              for(
                let p=0;
                p<arr.length;
                p+=chunk
              ){
                binary += String.fromCharCode.apply(
                  null,
                  arr.subarray(p,p+chunk)
                );
              }

              const data=btoa(binary);

              const safeName =
                String(
                  filename || 'DENTYAR-report'
                ).replace(
                  /[\\/:*?"<>|]/g,
                  '_'
                );

              /*
               * DIRECT:
               * Android MediaStore ->
               * Download/DENTYAR/Reports
               */

              if(options.share===false){

                let nativeDirect =
                  (C.Plugins &&
                   C.Plugins.DentyarNative) ||
                  null;

                if(
                  !nativeDirect &&
                  typeof C.registerPlugin==='function'
                ){
                  nativeDirect =
                    C.registerPlugin(
                      'DentyarNative'
                    );
                }

                if(
                  !nativeDirect ||
                  typeof nativeDirect.saveToDownloads!=='function'
                ){
                  throw new Error(
                    'DentyarNative plugin is not available'
                  );
                }

                const result =
                  await nativeDirect.saveToDownloads({
                    filename:safeName,
                    mimeType:String(
                      mime ||
                      'application/octet-stream'
                    ),
                    data:data
                  });

                if(
                  !result ||
                  result.saved!==true
                ){
                  throw new Error(
                    'Android MediaStore did not confirm the save'
                  );
                }

                return {
                  saved:true,
                  shared:false,
                  path:
                    result.path ||
                    'Download/DENTYAR/Reports/' +
                    safeName,
                  uri:
                    result.uri || ''
                };
              }

              /*
               * SHARE:
               * Keep the existing working
               * Capacitor Filesystem + Share path.
               */

              let fs =
                (C.Plugins &&
                 C.Plugins.Filesystem) ||
                null;

              if(
                !fs &&
                typeof C.registerPlugin==='function'
              ){
                try{
                  fs =
                    C.registerPlugin(
                      'Filesystem'
                    );
                }catch(_){}
              }

              if(
                !fs ||
                typeof fs.writeFile!=='function'
              ){
                throw new Error(
                  'Capacitor Filesystem plugin is not included'
                );
              }

              const relativePath =
                'DENTYAR/' +
                safeName;

              let uri='';
              let savedDirectory=null;
              let lastError=null;

              const documents =
                (C.Directory &&
                 C.Directory.Documents) ||
                'DOCUMENTS';

              const candidates=[
                documents,
                'DOCUMENTS'
              ];

              for(
                const directory
                of [...new Set(candidates)]
              ){

                try{

                  await fs.writeFile({
                    path:relativePath,
                    data:data,
                    directory:directory,
                    recursive:true
                  });

                  if(
                    typeof fs.readFile==='function'
                  ){

                    const check =
                      await fs.readFile({
                        path:relativePath,
                        directory:directory
                      });

                    if(
                      !check ||
                      typeof check.data!=='string' ||
                      check.data.length<16
                    ){
                      throw new Error(
                        'Android file verification failed'
                      );
                    }
                  }

                  if(
                    typeof fs.getUri==='function'
                  ){

                    const r =
                      await fs.getUri({
                        path:relativePath,
                        directory:directory
                      });

                    uri=String(
                      (
                        r &&
                        (
                          r.uri ||
                          r.path
                        )
                      ) || ''
                    );
                  }

                  savedDirectory=directory;
                  break;

                }catch(e){
                  lastError=e;
                }
              }

              if(!savedDirectory){
                throw(
                  lastError ||
                  new Error(
                    'Unable to save report on Android'
                  )
                );
              }

              let sh =
                (C.Plugins &&
                 C.Plugins.Share) ||
                null;

              if(
                !sh &&
                typeof C.registerPlugin==='function'
              ){
                try{
                  sh =
                    C.registerPlugin(
                      'Share'
                    );
                }catch(_){}
              }

              if(
                sh &&
                typeof sh.share==='function' &&
                uri
              ){

                try{

                  await sh.share({
                    title:'DENTYAR',
                    text:
                      'فایل دنت‌یار: ' +
                      safeName,
                    files:[uri],
                    mimeType:String(
                      mime ||
                      'application/octet-stream'
                    ),
                    dialogTitle:
                      'ذخیره یا ارسال فایل'
                  });

                  return {
                    saved:true,
                    shared:true,
                    path:relativePath,
                    uri:uri,
                    directory:savedDirectory
                  };

                }catch(e){

                  if(
                    e &&
                    (
                      e.name==='AbortError' ||
                      /cancel|canceled|cancelled/i.test(
                        String(
                          e.message || e
                        )
                      )
                    )
                  ){

                    return {
                      saved:true,
                      shared:false,
                      cancelled:true,
                      path:relativePath,
                      uri:uri,
                      directory:savedDirectory
                    };
                  }

                  return {
                    saved:true,
                    shared:false,
                    shareError:e,
                    path:relativePath,
                    uri:uri,
                    directory:savedDirectory
                  };
                }
              }

              return {
                saved:true,
                shared:false,
                path:relativePath,
                uri:uri,
                directory:savedDirectory
              };

            }catch(e){

              console.error(
                'DENTYAR V59 Android export failed',
                e
              );

              return {
                saved:false,
                shared:false,
                error:e
              };
            }
          }
          '''

          text = (
              text[:start]
              + new_function
              + text[end:]
          )

          path.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "OK: APK-only bridge injected"
          )
          PY

      - name: بررسی اتصال Direct
        run: |
          python3 <<'PY'
          from pathlib import Path

          text = Path(
              "www/index.html"
          ).read_text(
              encoding="utf-8"
          )

          required = [
              "DentyarNative",
              "saveToDownloads",
              "options.share===false",
              "Download/DENTYAR/Reports/",
              "async function v31NativeFile",
              "async function downloadBlob"
          ]

          missing = [
              item for item in required
              if item not in text
          ]

          if missing:
              print("ERROR: Direct bridge validation failed")

              for item in missing:
                  print(" - " + item)

              raise SystemExit(1)

          print(
              "OK: Direct bridge validation passed"
          )
          PY

      - name: همگام سازی Capacitor
        run: |
          npx cap sync android

      - name: نصب Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: ساخت APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: بارگذاری APK
        uses: actions/upload-artifact@v4
        with:
          name: DENTYAR-V59-APK-DIRECT-MEDIASTORE
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
