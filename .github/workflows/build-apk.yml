name: Build DENTYAR V59 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v4

      - name: نصب Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ساخت پروژه Capacitor
        run: |
          mkdir -p www
          cp DENTYAR_V59_NUMBERS_UNIFIED_FINAL.html www/index.html

          cat > package.json <<'EOF'
          {
            "name": "dentyar-v59",
            "version": "59.0.0",
            "private": true,
            "scripts": {
              "build": "echo DENTYAR V59"
            },
            "dependencies": {
              "@capacitor/core": "^7.4.3",
              "@capacitor/android": "^7.4.3",
              "@capacitor/cli": "^7.4.3",
              "@capacitor/filesystem": "^7.0.4",
              "@capacitor/share": "^7.0.4"
            }
          }
          EOF

          npm install

          npx cap init "دنتی‌یار" "com.dentyar.app" --web-dir www
          npx cap add android

      - name: ایجاد Native Direct Export Plugin
        run: |
          mkdir -p android/app/src/main/java/com/dentyar/app

          cat > android/app/src/main/java/com/dentyar/app/DentyarNativePlugin.java <<'EOF'
          package com.dentyar.app;

          import android.content.ContentResolver;
          import android.content.ContentValues;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          import java.io.OutputStream;

          @CapacitorPlugin(name = "DentyarNative")
          public class DentyarNativePlugin extends Plugin {

              @PluginMethod
              public void saveToDownloads(PluginCall call) {

                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.Q) {
                      call.reject(
                          "Android 10 or newer is required for public Downloads export"
                      );
                      return;
                  }

                  String fileName = call.getString(
                      "filename",
                      "DENTYAR-report"
                  );

                  String mimeType = call.getString(
                      "mimeType",
                      "application/octet-stream"
                  );

                  String data = call.getString("data", "");

                  if (data == null || data.isEmpty()) {
                      call.reject("Empty report data");
                      return;
                  }

                  fileName = fileName.replaceAll(
                      "[\\\\/:*?\"<>|]",
                      "_"
                  );

                  ContentResolver resolver =
                      getContext().getContentResolver();

                  ContentValues values = new ContentValues();

                  values.put(
                      MediaStore.Downloads.DISPLAY_NAME,
                      fileName
                  );

                  values.put(
                      MediaStore.Downloads.MIME_TYPE,
                      mimeType
                  );

                  values.put(
                      MediaStore.Downloads.RELATIVE_PATH,
                      Environment.DIRECTORY_DOWNLOADS
                          + "/DENTYAR/Reports"
                  );

                  values.put(
                      MediaStore.Downloads.IS_PENDING,
                      1
                  );

                  Uri uri = null;

                  try {

                      uri = resolver.insert(
                          MediaStore.Downloads.EXTERNAL_CONTENT_URI,
                          values
                      );

                      if (uri == null) {
                          throw new Exception(
                              "MediaStore could not create the report file"
                          );
                      }

                      byte[] bytes =
                          Base64.decode(data, Base64.DEFAULT);

                      try (OutputStream out =
                               resolver.openOutputStream(uri)) {

                          if (out == null) {
                              throw new Exception(
                                  "Could not open report output stream"
                              );
                          }

                          out.write(bytes);
                          out.flush();
                      }

                      ContentValues done =
                          new ContentValues();

                      done.put(
                          MediaStore.Downloads.IS_PENDING,
                          0
                      );

                      resolver.update(
                          uri,
                          done,
                          null,
                          null
                      );

                      JSObject result =
                          new JSObject();

                      result.put("saved", true);
                      result.put("uri", uri.toString());
                      result.put(
                          "path",
                          "Download/DENTYAR/Reports/"
                              + fileName
                      );

                      call.resolve(result);

                  } catch (Exception e) {

                      if (uri != null) {
                          try {
                              resolver.delete(
                                  uri,
                                  null,
                                  null
                              );
                          } catch (Exception ignored) {
                          }
                      }

                      call.reject(
                          "Direct export failed: "
                              + e.getMessage(),
                          e
                      );
                  }
              }
          }
          EOF

      - name: ایجاد MainActivity
        run: |
          cat > android/app/src/main/java/com/dentyar/app/MainActivity.java <<'EOF'
          package com.dentyar.app;

          import android.os.Bundle;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(Bundle savedInstanceState) {

                  registerPlugin(
                      DentyarNativePlugin.class
                  );

                  super.onCreate(savedInstanceState);
              }
          }
          EOF

      - name: افزودن Direct Bridge بدون تغییر مسیر Share
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("www/index.html")
          text = path.read_text(encoding="utf-8")

          if "async function __dentyarOriginalDownloadBlob(" in text:
              raise SystemExit(
                  "Direct bridge already injected; refusing duplicate injection"
              )

          pattern = re.compile(
              r"async function downloadBlob\s*\([^)]*\)\s*\{.*?\n\}\s*\n\s*function dentyarReportAction\s*\(",
              re.S
          )

          match = pattern.search(text)

          if not match:
              raise SystemExit(
                  "Could not locate the original downloadBlob function"
              )

          original_block = match.group(0)

          marker = "\nfunction dentyarReportAction("

          if marker not in original_block:
              raise SystemExit(
                  "Could not locate dentyarReportAction boundary"
              )

          original_function = original_block[
              :original_block.rfind(marker)
          ]

          if not original_function.startswith(
              "async function downloadBlob"
          ):
              raise SystemExit(
                  "Unexpected downloadBlob structure"
              )

          original_function = original_function.replace(
              "async function downloadBlob",
              "async function __dentyarOriginalDownloadBlob",
              1
          )

          wrapper = r'''
          async function downloadBlob(bytes, filename, mime, options={}){
            const C=window.Capacitor;

            if(
              options &&
              options.share===false &&
              C &&
              typeof C.isNativePlatform==='function' &&
              C.isNativePlatform()
            ){
              try{
                let native=null;

                if(
                  C.Plugins &&
                  C.Plugins.DentyarNative
                ){
                  native=C.Plugins.DentyarNative;
                }

                if(
                  !native &&
                  typeof C.registerPlugin==='function'
                ){
                  native=C.registerPlugin('DentyarNative');
                }

                if(
                  !native ||
                  typeof native.saveToDownloads!=='function'
                ){
                  throw new Error(
                    'DentyarNative plugin is not available'
                  );
                }

                const arr =
                  bytes instanceof Uint8Array
                    ? bytes
                    : new Uint8Array(bytes);

                let binary='';
                const chunk=0x8000;

                for(
                  let p=0;
                  p<arr.length;
                  p+=chunk
                ){
                  binary += String.fromCharCode.apply(
                    null,
                    arr.subarray(p,p+chunk)
                  );
                }

                const data=btoa(binary);

                const safeName=String(
                  filename || 'DENTYAR-report'
                ).replace(
                  /[\\/:*?"<>|]/g,
                  '_'
                );

                const result =
                  await native.saveToDownloads({
                    filename:safeName,
                    mimeType:String(
                      mime || 'application/octet-stream'
                    ),
                    data:data
                  });

                if(
                  !result ||
                  result.saved!==true
                ){
                  throw new Error(
                    'Native direct export did not confirm save'
                  );
                }

                return 'saved';

              }catch(e){
                console.error(
                  'DENTYAR Direct export failed',
                  e
                );

                throw new Error(
                  'Android direct export failed: ' +
                  String(e && e.message || e)
                );
              }
            }

            return await __dentyarOriginalDownloadBlob(
              bytes,
              filename,
              mime,
              options
            );
          }
          '''

          replacement = (
              original_function
              + "\n\n"
              + wrapper.strip()
              + marker
          )

          text = (
              text[:match.start()]
              + replacement
              + text[match.end():]
          )

          path.write_text(text, encoding="utf-8")

          print(
              "Direct bridge injected successfully."
          )
          PY

      - name: بررسی نهایی فایل Web
        run: |
          python3 <<'PY'
          from pathlib import Path

          text = Path("www/index.html").read_text(
              encoding="utf-8"
          )

          required = [
              "async function __dentyarOriginalDownloadBlob",
              "async function downloadBlob",
              "DentyarNative",
              "saveToDownloads",
              "function dentyarReportAction",
              "async function v31NativeFile"
          ]

          for item in required:
              if item not in text:
                  raise SystemExit(
                      "Missing required item: " + item
                  )

          print(
              "Web validation passed."
          )
          PY

      - name: همگام‌سازی Capacitor
        run: |
          npx cap sync android

      - name: بررسی Native Plugin
        run: |
          test -f android/app/src/main/java/com/dentyar/app/DentyarNativePlugin.java
          test -f android/app/src/main/java/com/dentyar/app/MainActivity.java
          grep -q '@CapacitorPlugin(name = "DentyarNative")' \
            android/app/src/main/java/com/dentyar/app/DentyarNativePlugin.java
          grep -q 'registerPlugin(' \
            android/app/src/main/java/com/dentyar/app/MainActivity.java

          echo "Native plugin validation passed."

      - name: نصب Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: ساخت APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: بارگذاری APK
        uses: actions/upload-artifact@v4
        with:
          name: DENTYAR-V59-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
