name: Build DENTYAR V59 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v4

      - name: نصب Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ساخت پروژه Capacitor
        run: |
          mkdir -p www
          cp DENTYAR_V59_NUMBERS_UNIFIED_FINAL.html www/index.html

          cat > package.json <<'EOF'
          {
            "name": "dentyar-v59",
            "version": "59.0.0",
            "private": true,
            "scripts": {
              "build": "echo DENTYAR V59"
            },
            "dependencies": {
              "@capacitor/core": "^7.4.3",
              "@capacitor/android": "^7.4.3",
              "@capacitor/cli": "^7.4.3",
              "@capacitor/filesystem": "^7.0.4",
              "@capacitor/share": "^7.0.4"
            }
          }
          EOF

          npm install

          npx cap init "دنتی‌یار" "com.dentyar.app" --web-dir www
          npx cap add android

          # ============================================================
          # DENTYAR Native Direct Export
          # ذخیره مستقیم گزارش در:
          # Download/DENTYAR/Reports
          # ============================================================

          mkdir -p android/app/src/main/java/com/dentyar/app

          cat > android/app/src/main/java/com/dentyar/app/DentyarNativePlugin.java <<'EOF'
          package com.dentyar.app;

          import android.content.ContentResolver;
          import android.content.ContentValues;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          import java.io.OutputStream;

          @CapacitorPlugin(name = "DentyarNative")
          public class DentyarNativePlugin extends Plugin {

              @PluginMethod
              public void saveToDownloads(PluginCall call) {

                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.Q) {
                      call.reject("Android 10 or newer is required for public Downloads export");
                      return;
                  }

                  String fileName = call.getString(
                          "filename",
                          "DENTYAR-report"
                  );

                  String mimeType = call.getString(
                          "mimeType",
                          "application/octet-stream"
                  );

                  String data = call.getString("data", "");

                  if (data == null || data.isEmpty()) {
                      call.reject("Empty report data");
                      return;
                  }

                  fileName = fileName.replaceAll(
                          "[\\\\/:*?\"<>|]",
                          "_"
                  );

                  ContentResolver resolver =
                          getContext().getContentResolver();

                  ContentValues values = new ContentValues();

                  values.put(
                          MediaStore.Downloads.DISPLAY_NAME,
                          fileName
                  );

                  values.put(
                          MediaStore.Downloads.MIME_TYPE,
                          mimeType
                  );

                  values.put(
                          MediaStore.Downloads.RELATIVE_PATH,
                          Environment.DIRECTORY_DOWNLOADS
                                  + "/DENTYAR/Reports"
                  );

                  values.put(
                          MediaStore.Downloads.IS_PENDING,
                          1
                  );

                  Uri uri = null;

                  try {

                      uri = resolver.insert(
                              MediaStore.Downloads.EXTERNAL_CONTENT_URI,
                              values
                      );

                      if (uri == null) {
                          throw new Exception(
                                  "MediaStore could not create the report file"
                          );
                      }

                      byte[] bytes = Base64.decode(
                              data,
                              Base64.DEFAULT
                      );

                      try (OutputStream out =
                                   resolver.openOutputStream(uri)) {

                          if (out == null) {
                              throw new Exception(
                                      "Could not open report output stream"
                              );
                          }

                          out.write(bytes);
                          out.flush();
                      }

                      ContentValues done = new ContentValues();

                      done.put(
                              MediaStore.Downloads.IS_PENDING,
                              0
                      );

                      resolver.update(
                              uri,
                              done,
                              null,
                              null
                      );

                      JSObject ret = new JSObject();

                      ret.put(
                              "saved",
                              true
                      );

                      ret.put(
                              "uri",
                              uri.toString()
                      );

                      ret.put(
                              "path",
                              "Download/DENTYAR/Reports/"
                                      + fileName
                      );

                      call.resolve(ret);

                  } catch (Exception e) {

                      if (uri != null) {
                          try {
                              resolver.delete(
                                      uri,
                                      null,
                                      null
                              );
                          } catch (Exception ignored) {
                          }
                      }

                      call.reject(
                              "Direct export failed: "
                                      + e.getMessage(),
                              e
                      );
                  }
              }
          }
          EOF

          cat > android/app/src/main/java/com/dentyar/app/MainActivity.java <<'EOF'
          package com.dentyar.app;

          import android.os.Bundle;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  registerPlugin(
                          DentyarNativePlugin.class
                  );
              }
          }
          EOF

          npx cap sync android

      - name: نصب Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: ساخت APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: بارگذاری APK
        uses: actions/upload-artifact@v4
        with:
          name: DENTYAR-V59-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
