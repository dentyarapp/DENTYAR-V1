name: Deploy DENTYAR V59 PWA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: dentyar-pwa
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v4

      - name: آماده‌سازی نسخه وب نصب‌شونده
        run: |
          rm -rf dist
          mkdir -p dist
          cp DENTYAR_V59_NUMBERS_UNIFIED_FINAL.html dist/index.html
          cp manifest.webmanifest dist/manifest.webmanifest
          cp sw.js dist/sw.js
          test -s dist/index.html
          test -s dist/manifest.webmanifest
          test -s dist/sw.js

      - name: انتشار نسخه وب
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
