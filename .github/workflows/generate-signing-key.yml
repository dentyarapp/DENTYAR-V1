name: Generate DENTYAR Permanent Signing Key

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-key:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate password and generate key
        env:
          STORE_PASSWORD: "${{ secrets.DENTYAR_KEYSTORE_PASSWORD }}"
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${STORE_PASSWORD:-}" ] || [ "${#STORE_PASSWORD}" -lt 16 ]; then
            echo "ERROR: Signing password is missing or too short."
            exit 1
          fi

          keytool -genkeypair \
            -noprompt \
            -keystore "$RUNNER_TEMP/dentyar-release.keystore" \
            -storetype JKS \
            -alias dentyar-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$STORE_PASSWORD" \
            -keypass "$STORE_PASSWORD" \
            -dname "CN=DENTYAR Release, OU=DENTYAR, O=DENTYAR, L=Unknown, ST=Unknown, C=DE"

          keytool -list -v \
            -keystore "$RUNNER_TEMP/denty
