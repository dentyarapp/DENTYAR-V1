  .row{display:flex;gap:8px;}

  /* ===== DENTYAR premium dental identity ===== */
  :root{

/* ===================== IndexedDB — مرحله اول: آینه‌ی ایمن =====================
   هدف این مرحله: نگه‌داری همزمان همان STATE در localStorage و IndexedDB.
   localStorage فعلاً منبع اصلی باقی می‌ماند؛ هیچ حذف/جایگزینی خودکاری انجام نمی‌شود.
*/
const DENTYAR_IDB = {
  dbName: 'dentyar_db_v1',
  version: 1,
  db: null,
  ready: null
};

function openDentyarIDB(){
  if(DENTYAR_IDB.ready) return DENTYAR_IDB.ready;
  DENTYAR_IDB.ready = new Promise((resolve, reject)=>{
    if(!('indexedDB' in window)){
      reject(new Error('IndexedDB در این محیط در دسترس نیست.'));
      return;
    }
    const req = indexedDB.open(DENTYAR_IDB.dbName, DENTYAR_IDB.version);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if(!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', {keyPath:'key'});
      if(!db.objectStoreNames.contains('patients')){
        const st = db.createObjectStore('patients', {keyPath:'id'});
        st.createIndex('fileNo','fileNo',{unique:false});
        st.createIndex('nationalId','nationalId',{unique:false});
        st.createIndex('createdAt','createdAt',{unique:false});
      }
      if(!db.objectStoreNames.contains('dentists')){
        const st = db.createObjectStore('dentists', {keyPath:'id'});
        st.createIndex('name','name',{unique:false});
      }
      if(!db.objectStoreNames.contains('appointments')){
        const st = db.createObjectStore('appointments', {keyPath:'id'});
        st.createIndex('date','date',{unique:false});
        st.createIndex('dentistId','dentistId',{unique:false});
      }
      if(!db.objectStoreNames.contains('backupSnapshots')){
        const st = db.createObjectStore('backupSnapshots', {keyPath:'id'});
        st.createIndex('ts','ts',{unique:false});
      }
      if(!db.objectStoreNames.contains('patientFiles')){
        const st = db.createObjectStore('patientFiles', {keyPath:'id'});
        st.createIndex('patientId','patientId',{unique:false});
      }
    };
    req.onsuccess = e => {
      DENTYAR_IDB.db = e.target.result;
      DENTYAR_IDB.db.onversionchange = () => DENTYAR_IDB.db.close();
      resolve(DENTYAR_IDB.db);
    };
    req.onerror = () => reject(req.error || new Error('خطا در بازکردن IndexedDB'));
  });
  return DENTYAR_IDB.ready;
}

function idbPutAll(state){
  return openDentyarIDB().then(db=>new Promise((resolve,reject)=>{
    try{
      const tx = db.transaction(['meta','patients','dentists','appointments','backupSnapshots','patientFiles'],'readwrite');
      const meta = tx.objectStore('meta');
      const patients = tx.objectStore('patients');
      const dentists = tx.objectStore('dentists');
      const appointments = tx.objectStore('appointments');
      const backups = tx.objectStore('backupSnapshots');
      const files = tx.objectStore('patientFiles');

      meta.put({key:'schemaVersion', value:1});
      meta.put({key:'lastMirrorAt', value:Date.now()});
      meta.put({key:'clinicState', value:{meta:state.meta, lists:state.lists, treatmentPrices:state.treatmentPrices||{}, backupHistory:state.backupHistory||[]}});
      patients.clear(); dentists.clear(); appointments.clear(); backups.clear(); files.clear();
      (state.patients||[]).forEach(p=>patients.put(p));
      (state.dentists||[]).forEach(d=>dentists.put(d));
      (state.appointments||[]).forEach(a=>appointments.put(a));
      (state.backupHistory||[]).forEach(b=>backups.put(b));
      // در این مرحله فایل‌های Base64 داخل رکورد بیمار بدون تغییر حفظ می‌شوند.
      // جداسازی Blob فایل‌ها برای مرحله بعدی انجام خواهد شد.
      tx.oncomplete = ()=>resolve(true);
      tx.onerror = ()=>reject(tx.error || new Error('خطا در ذخیره آینه IndexedDB'));
      tx.onabort = ()=>reject(tx.error || new Error('تراکنش IndexedDB لغو شد'));
    }catch(e){ reject(e); }
  }));
}

function startDentyarIDBMirror(){
  openDentyarIDB()
    .then(()=>idbPutAll(STATE))
    .then(()=>console.info('DENTYAR IndexedDB mirror ready'))
    .catch(err=>console.warn('IndexedDB mirror unavailable:', err));
}

function loadState(){
  try{
    const raw = localStorage.getItem(APP_KEY);
    if(raw){ STATE = JSON.parse(raw); }
    else { STATE = DEFAULT_STATE(); saveState(); }
    // fill any missing keys from default (forward-compat)
    const def = DEFAULT_STATE();
    for(const k in def){ if(!(k in STATE)) STATE[k] = def[k]; }
    for(const k in def.lists){ if(!(k in STATE.lists)) STATE.lists[k] = def.lists[k]; }
    for(const k in def.meta){ if(!(k in STATE.meta)) STATE.meta[k] = def.meta[k]; }
    // Brand migration: preserve records/settings while updating only the old default clinic identity.
    if(!STATE.meta.clinicName || STATE.meta.clinicName === 'DENTYAR' || /لبخند بهتر/i.test(STATE.meta.clinicName)){
      STATE.meta.clinicName = 'مطب لبخند زیبا';
    }
    if(!STATE.meta.slogan || /Your Smart Dental Assistant/i.test(STATE.meta.slogan)){
      STATE.meta.slogan = 'دنت‌یار؛ دستیار هوشمند دندان‌پزشکی شما';
    }
    ensureStandardLists();
    ensureFormFieldSettings();
    normalizeFinancialData();
    saveState();
  }catch(e){
    console.error('loadState error', e);
    STATE = DEFAULT_STATE();
  }
  ensureStandardLists();
  ensureFormFieldSettings();
  return STATE;
}
function saveState(){
  localStorage.setItem(APP_KEY, JSON.stringify(STATE));
  // آینه‌سازی غیرهمزمان؛ اگر IndexedDB در دسترس نباشد، localStorage همچنان منبع اصلی است.
  if (typeof indexedDB !== 'undefined' && location.protocol !== 'content:') {
    idbPutAll(STATE).catch(err=>console.warn('IndexedDB mirror save failed:', err));
  }
  if(window.DentyarSync && STATE.meta && STATE.meta.sync && STATE.meta.sync.enabled){ DentyarSync.schedulePush(); }
}

function calcVisitFinance(prefix){
  const gross=Math.max(0,moneyVal(prefix+'Gross'));
  const discount=Math.min(Math.max(0,moneyVal(prefix+'Discount')), gross);
  const afterDiscount=Math.max(0,gross-discount);
  const insurance=Math.min(Math.max(0,moneyVal(prefix+'Insurance')), afterDiscount);
  const net=Math.max(0,afterDiscount-insurance);
  const cash=Math.max(0,moneyVal(prefix+'Cash'));
  const card=Math.max(0,moneyVal(prefix+'Card'));
  const transfer=Math.max(0,moneyVal(prefix+'Transfer'));
  const other=Math.max(0,moneyVal(prefix+'Other'));
  const refund=Math.max(0,moneyVal(prefix+'Refund'));
  const totalReceived=cash+card+transfer+other;
  const paid=Math.max(0,totalReceived-refund);
  const balance=Math.max(0,net-paid);
  const credit=Math.max(0,paid-net);
  const netEl=document.getElementById(prefix+'Net'), paidEl=document.getElementById(prefix+'Paid'), balEl=document.getElementById(prefix+'Balance');
  if(netEl) netEl.textContent=fmtMoney(net);

  const afterDiscount=Math.max(0,gross-discount);

/* ---------- تبدیل تاریخ میلادی به شمسی (الگوریتم عمومی و ریاضی، بدون نیاز به کتابخانه) ---------- */
function gregorianToJalali(gy, gm, gd){
  const g_d_m = [0,31,59,90,120,151,181,212,243,273,304,334];
  let jy = (gy <= 1600) ? 0 : 979;
  gy -= (gy <= 1600) ? 621 : 1600;
  const gy2 = (gm > 2) ? (gy + 1) : gy;
  let days = (365*gy) + Math.floor((gy2+3)/4) - Math.floor((gy2+99)/100) + Math.floor((gy2+399)/400) - 80 + gd + g_d_m[gm-1];
  jy += 33 * Math.floor(days/12053);
  days %= 12053;
  jy += 4 * Math.floor(days/1461);
  days %= 1461;
  if(days > 365){
    jy += Math.floor((days-1)/365);
    days = (days-1) % 365;
  }
  let jm, jd;
  if(days < 186){
    jm = 1 + Math.floor(days/31);
    jd = 1 + (days % 31);
  } else {
    jm = 7 + Math.floor((days-186)/30);
    jd = 1 + ((days-186) % 30);
  }
  return [jy, jm, jd];
}

function jalaliToGregorian(jy,jm,jd){
  jy=Number(jy); jm=Number(jm); jd=Number(jd);
  if(jy<1200 || jy>1600 || jm<1 || jm>12 || jd<1 || jd>31) return null;
  jy += 1595;
  let days = -355668 + 365*jy + Math.floor(jy/33)*8 + Math.floor(((jy%33)+3)/4) + jd + (jm<7 ? (jm-1)*31 : ((jm-7)*30)+186);
  let gy=400*Math.floor(days/146097); days%=146097;
  if(days>36524){ gy+=100*Math.floor(--days/36524); days%=36524; if(days>=365) days++; }
  gy+=4*Math.floor(days/1461); days%=1461;
  if(days>365){ gy+=Math.floor((days-1)/365); days=(days-1)%365; }
  const gd=days+1;
  const leap=(gy%4===0 && gy%100!==0) || gy%400===0;
  const gmDays=[31,leap?29:28,31,30,31,30,31,31,30,31,30,31];
  let gm=1, rem=gd;
  while(gm<=12 && rem>gmDays[gm-1]){ rem-=gmDays[gm-1]; gm++; }
  return [gy,gm,rem];
}
function v26ISOFromJalali(text){

  const g=jalaliToGregorian(+m[1],+m[2],+m[3]);

/* ===================== XLSX writer (pure JS, zip "store" method — no compression, no deps) ===================== */
const XLSXWriter = (function(){
  function crc32(buf){
    let c, crcTable = crc32.table || (crc32.table = (()=>{
      const t=[];
      for(let n=0;n<256;n++){ c=n; for(let k=0;k<8;k++){ c = (c&1)?(0xEDB88320 ^ (c>>>1)):(c>>>1); } t[n]=c; }
      return t;
    })());
    let crc = 0 ^ (-1);
    for(let i=0;i<buf.length;i++){ crc = (crc>>>8) ^ crcTable[(crc ^ buf[i]) & 0xFF]; }
    return (crc ^ (-1)) >>> 0;
  }
  function strToBytes(str){ return new TextEncoder().encode(str); }
  function dosDateTime(){
    const d = new Date();
    const time = ((d.getHours()&0x1F)<<11) | ((d.getMinutes()&0x3F)<<5) | ((d.getSeconds()/2)&0x1F);
    const date = (((d.getFullYear()-1980)&0x7F)<<9) | (((d.getMonth()+1)&0xF)<<5) | (d.getDate()&0x1F);
    return {time, date};
  }
  function makeZip(files){ // files: [{name, data(Uint8Array)}]
    const {time, date} = dosDateTime();
    let localParts=[], centralParts=[], offset=0;
    for(const f of files){
      const nameBytes = strToBytes(f.name);
      const data = f.data;
      const crc = crc32(data);
      const size = data.length;
      const local = new Uint8Array(30 + nameBytes.length + size);
      const dv = new DataView(local.buffer);
      dv.setUint32(0, 0x04034b50, true);
      dv.setUint16(4, 20, true); // version needed
      dv.setUint16(6, 0, true); // flags
      dv.setUint16(8, 0, true); // method = 0 store
      dv.setUint16(10, time, true);
      dv.setUint16(12, date, true);
      dv.setUint32(14, crc, true);
      dv.setUint32(18, size, true);
      dv.setUint32(22, size, true);
      dv.setUint16(26, nameBytes.length, true);
      dv.setUint16(28, 0, true);
      local.set(nameBytes, 30);
      local.set(data, 30+nameBytes.length);
      localParts.push(local);

      const central = new Uint8Array(46 + nameBytes.length);
      const cdv = new DataView(central.buffer);
      cdv.setUint32(0, 0x02014b50, true);
      cdv.setUint16(4, 20, true);
      cdv.setUint16(6, 20, true);
      cdv.setUint16(8, 0, true);
      cdv.setUint16(10, 0, true);
      cdv.setUint16(12, time, true);
      cdv.setUint16(14, date, true);
      cdv.setUint32(16, crc, true);
      cdv.setUint32(20, size, true);
      cdv.setUint32(24, size, true);
      cdv.setUint16(28, nameBytes.length, true);
      cdv.setUint16(30, 0, true);
      cdv.setUint16(32, 0, true);

      cdv.setUint16(36, 0, true);

    edv.setUint32(0, 0x06054b50, true);

    edv.setUint16(8, files.length, true);
    edv.setUint16(10, files.length, true);

    edv.setUint32(16, centralStart, true);
    edv.setUint16(20, 0, true);

    const out = new Uint8Array(totalLen);
    let p=0;
    for(const l of localParts){ out.set(l,p); p+=l.length; }

    rows.forEach((row,ri)=>{

      row.forEach((cell,ci)=>{
        const ref = colName(ci)+(ri+1);
        if(typeof cell === 'number' && isFinite(cell)){

        } else {
          cellsXml += `<c r="${ref}" t="str"><v>${esc(cell)}</v></c>`;
        }
      });

<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetPr/><sheetViews><sheetView rightToLeft="1" workbookViewId="0"/></sheetViews><sheetData>${rowsXml}</sheetData></worksheet>`;
  }

<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`;
    const rootRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`;
    const workbook = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="${esc(sheetName)}" sheetId="1" r:id="rId1"/></sheets></workbook>`;
    const workbookRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`;
    const styles = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="1"><font><sz val="11"/><name val="Tahoma"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
    const sheet1 = buildSheetXml(rows);
    const files = [
      {name:'[Content_Types].xml', data: strToBytes(contentTypes)},
      {name:'_rels/.rels', data: strToBytes(rootRels)},
      {name:'xl/workbook.xml', data: strToBytes(workbook)},
      {name:'xl/_rels/workbook.xml.rels', data: strToBytes(workbookRels)},
      {name:'xl/styles.xml', data: strToBytes(styles)},
      {name:'xl/worksheets/sheet1.xml', data: strToBytes(sheet1)},
    ];

  }

})();


async function v31NativeFile(bytes, filename, mime, options={}){
  /*
   * V59 FINAL NATIVE EXPORT
   * Direct: DentyarNative -> Android MediaStore -> Download/DENTYAR/Reports
   * Share: Capacitor Filesystem -> Share
   * The two paths are intentionally independent.
   */
  try{
    const C=window.Capacitor;
    if(!C || typeof C.isNativePlatform!=='function' || !C.isNativePlatform()){
      return {saved:false,shared:false};
    }

    const arr=bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
    let binary='';
    const chunk=0x8000;
    for(let p=0;p<arr.length;p+=chunk){
      binary+=String.fromCharCode.apply(null,arr.subarray(p,p+chunk));
    }
    const data=btoa(binary);
    const safeName=String(filename||'DENTYAR-report').replace(/[\\/:*?"<>|]/g,'_');

    // DIRECT: use the custom native plugin only.
    // This avoids Capacitor Filesystem's app-scoped Documents directory.
    if(options.share===false){
      let nativePlugin=null;
      try{
        nativePlugin = (C.Plugins&&C.Plugins.DentyarNative) || null;
        if(!nativePlugin && typeof C.registerPlugin==='function'){
          nativePlugin=C.registerPlugin('DentyarNative');
        }
      }catch(e){ nativePlugin=null; }

      if(!nativePlugin || typeof nativePlugin.saveToDownloads!=='function'){
        throw new Error('DentyarNative plugin is not available');
      }

      const result=await nativePlugin.saveToDownloads({
        filename:safeName,
        mimeType:String(mime||'application/octet-stream'),
        data:data
      });

      if(!result || result.saved!==true){
        throw new Error('Native direct export did not confirm save');
      }

      return {
        saved:true,
        shared:false,
        path:String(result.path||'Download/DENTYAR/Reports/'+safeName),
        uri:String(result.uri||'')
      };
    }

    // SHARE: prepare a temporary/app-owned file, then hand its URI to Share.
    let fs=(C.Plugins&&C.Plugins.Filesystem)||null;
    if(!fs && typeof C.registerPlugin==='function'){
      fs=C.registerPlugin('Filesystem');
    }
    if(!fs || typeof fs.writeFile!=='function'){
      throw new Error('Capacitor Filesystem plugin is not available');
    }

    const path='DENTYAR/'+safeName;
    await fs.writeFile({
      path:path,
      data:data,
      directory:(C.Directory&&C.Directory.Cache)||'CACHE',
      recursive:true
    });
    const ur=await fs.getUri({
      path:path,
      directory:(C.Directory&&C.Directory.Cache)||'CACHE'
    });
    const uri=String((ur&&(ur.uri||ur.path))||'');
    if(!uri) throw new Error('Share file URI was not created');

    let sh=(C.Plugins&&C.Plugins.Share)||null;
    if(!sh && typeof C.registerPlugin==='function') sh=C.registerPlugin('Share');
    if(!sh || typeof sh.share!=='function') throw new Error('Capacitor Share plugin is not available');

    try{
      await sh.share({
        title:'DENTYAR',
        text:'فایل دنت‌یار: '+safeName,
        files:[uri],
        dialogTitle:'اشتراک گزارش'
      });
      return {saved:true,shared:true,path,uri};
    }catch(e){
      if(e && (e.name==='AbortError'||/cancel|canceled|cancelled/i.test(String(e.message||e)))){
        return {saved:false,shared:false,cancelled:true,path,uri};
      }
      throw e;
    }
  }catch(e){
    console.error('DENTYAR V59 native export failed',e);
    return {saved:false,shared:false,error:e};
  }
}
async function downloadBlob(bytes, filename, mime, options={}){
  const native=await v31NativeFile(bytes,filename,mime,options);
  if(native.saved){
    if(native.cancelled) return 'cancelled';
    return native.shared ? 'shared' : 'saved';
  }
  const C=window.Capacitor;
  if(C && C.isNativePlatform && C.isNativePlatform()){
    const detail=native && native.error ? String(native.error.message||native.error) : 'native export unavailable';
    console.error('DENTYAR Android export failed:', detail);
    throw new Error('Android export failed: '+detail);
  }
  try{
    const blob=new Blob([bytes],{type:mime});
    const file=new File([blob],filename,{type:mime});
    if(options.share!==false && navigator.share && (!navigator.canShare || navigator.canShare({files:[file]}))){
      await navigator.share({title:'DENTYAR',text:'فایل دنت‌یار: '+filename,files:[file]});
      return 'shared';
    }
  }catch(e){ if(e && e.name==='AbortError') return 'cancelled'; }
  const blob=new Blob([bytes],{type:mime});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=filename; a.rel='noopener';
  document.body.appendChild(a); a.click();
  setTimeout(()=>{a.remove();URL.revokeObjectURL(url);},1200);
  return 'downloaded';
}
function dentyarReportAction(){

  return new Promise(function(resolve){

    const old =
      document.getElementById('dentyarReportActionOverlay');

    if(old) old.remove();

    const overlay =
      document.createElement('div');

    overlay.id =
      'dentyarReportActionOverlay';

    overlay.dir = 'rtl';

    overlay.style.cssText =
      'position:fixed;inset:0;z-index:99999;' +
      'background:rgba(0,0,0,.50);' +
      'display:flex;align-items:center;justify-content:center;' +
      'padding:20px;';

    const box =
      document.createElement('div');

    box.style.cssText =
      'width:min(420px,100%);background:#fff;' +
      'border-radius:18px;padding:22px;' +
      'box-shadow:0 20px 60px rgba(0,0,0,.30);' +
      'font-family:inherit;';

    const title =
      document.createElement('div');

    title.textContent =
      'نحوه دریافت گزارش';

    title.style.cssText =
      'font-size:18px;font-weight:800;' +
      'color:#12305e;text-align:center;' +
      'margin-bottom:18px;';

    box.appendChild(title);

    function makeButton(text,className){

      const button =
        document.createElement('button');

      button.type = 'button';

      button.textContent = text;

      button.className =
        'btn ' + className;

      button.style.cssText =
        'display:block;width:100%;min-height:48px;' +
        'margin-top:10px;border-radius:12px;' +
        'font-family:inherit;font-size:14px;' +
        'font-weight:800;cursor:pointer;';

      return button;
    }

    const direct =
      makeButton(
        'مستقیم',
        'btn-navy'
      );

    const share =
      makeButton(
        'شیر کردن گزارش',
        'btn-gold'
      );

    const cancel =
      makeButton(
        'انصراف',
        'btn-outline'
      );

    direct.onclick =
      function(){

        overlay.remove();

        resolve('direct');

      };

    share.onclick =
      function(){

        overlay.remove();

        resolve('share');

      };

    cancel.onclick =
      function(){

        overlay.remove();

        resolve('cancel');

      };

    box.appendChild(direct);

    box.appendChild(share);

    box.appendChild(cancel);

    overlay.appendChild(box);

    document.body.appendChild(overlay);

  });

}


async function exportRowsAsXLSX(
  rows,
  filename,
  sheetName,
  options={}
){

  const bytes =
    XLSXWriter.build(
      sheetName || 'گزارش',
      rows
    );

  return await downloadBlob(

    bytes,

    filename,

    'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',

    options

  );

}


async function exportRowsAsCSV(
  rows,
  filename,
  options={}
){

  const csv =
    rows.map(function(row){

      return row.map(function(cell){

        let value =
          String(
            cell == null ? '' : cell
          );

        if(/[",\n]/.test(value)){

          value =
            '"' +
            value.replace(/"/g,'""') +
            '"';

        }

        return value;

      }).join(',');

    }).join('\r\n');

  const bytes =
    new TextEncoder().encode(
      '\uFEFF' + csv
    );

  return await downloadBlob(

    bytes,

    filename,

    'text/csv;charset=utf-8',

    options

  );

}

/* ===================== قفل ورود (PIN) ===================== */
let pinBuffer = '';
function renderLock(){
  document.getElementById('lockScreen').innerHTML = `
    <img class="lockLogo" src="${DENTYAR_LOGO_DATA}" alt="لوگوی DENTYAR">
    <h2>DENTYAR</h2>
    <div class="lockSlogan"><span class="brandFa">دنت‌یار؛ دستیار هوشمند دندان‌پزشکی شما</span></div>
    <div class="pinDots" id="pinDots">${'<span></span>'.repeat(8)}</div>
    <div class="pinPad">
      ${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="pinPress('${n}')">${n}</button>`).join('')}
      <button class="clearBtn" onclick="pinClear()">C</button>
      <button onclick="pinPress('0')">0</button>
      <button class="unlockBtn" onclick="pinSubmit()">${ICON_UNLOCK}</button>
    </div>
    <div id="lockError"></div>
    <div id="lockHint">رمز پیش‌فرض: 12345678 — از بخش تنظیمات قابل تغییر است</div>
  `;
}
function updatePinDots(){
  const dots = document.querySelectorAll('#pinDots span');
  dots.forEach((d,i)=> d.classList.toggle('filled', i < pinBuffer.length));
}
function pinPress(d){
  if(pinBuffer.length>=8) return;
  pinBuffer += d;
  updatePinDots();
  document.getElementById('lockError').textContent='';
  if(pinBuffer.length===8){
    setTimeout(pinSubmit, 120);
  }
}
function pinSubmit(){
  if(toEnDigits(pinBuffer) === toEnDigits(STATE.meta.password) && pinBuffer.length===8){
    document.getElementById('lockScreen').style.display='none';
    document.getElementById('app').style.display='block';
    sessionStorage.setItem('lb_unlocked','1');
  } else {
    document.getElementById('lockError').textContent = 'رمز عبور اشتباه است';
    setTimeout(()=>{ pinBuffer=''; updatePinDots(); }, 400);
  }
}
function pinClear(){
  pinBuffer = '';
  updatePinDots();
  document.getElementById('lockError').textContent='';
}
// پشتیبانی از صفحه‌کلید واقعی لپ‌تاپ؛ کلیک ماوس روی اعداد صفحه نیز مثل قبل فعال می‌ماند.
document.addEventListener('keydown', function(e){
  const lock=document.getElementById('lockScreen');
  const app=document.getElementById('app');
  if(!lock || lock.style.display==='none' || (app && app.style.display==='block')) return;
  if(e.ctrlKey || e.altKey || e.metaKey) return;
  const keyDigit=/^[0-9]$/.test(e.key)?e.key:(/^Numpad[0-9]$/.test(e.code||'')?(e.code||'').slice(-1):null);
  if(keyDigit!==null){
    e.preventDefault();
    pinPress(keyDigit);
  } else if(e.key==='Backspace'){
    e.preventDefault();
    pinBuffer=pinBuffer.slice(0,-1);
    updatePinDots();
    const err=document.getElementById('lockError'); if(err) err.textContent='';
  } else if(e.key==='Enter'){
    e.preventDefault();
    pinSubmit();
  } else if(e.key==='Escape'){
    e.preventDefault();
    pinClear();
  }
});
function lockApp(){
  showModal(`
    <h3>خروج از برنامه</h3>
    <div style="font-size:14px;line-height:1.8;">آیا می‌خواهید قبل از خروج، اطلاعات ذخیره شود؟<br><span style="color:var(--muted);font-size:12px;">در صورت انتخاب «بله»، اطلاعات هم داخل برنامه ذخیره می‌شود و هم یک نسخه پشتیبان در حافظه گوشی قرار می‌گیرد.</span></div>
    <div class="modalBtns" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
      <button class="btn btn-outline" onclick="closeModal(); exitWithoutSave()">خیر، فقط خروج</button>
      <button class="btn btn-danger" id="exitSaveBtn" onclick="exitWithSave()">بله، ذخیره و خروج</button>
    </div>
    <button class="btn btn-outline btn-block" style="margin-top:8px" onclick="closeModal()">انصراف</button>
  `);
}
function finishLockApp(){
  sessionStorage.removeItem('lb_unlocked');
  sessionStorage.removeItem('lb_profile_unlocked');
  pinBuffer='';
  renderLock();
  document.getElementById('lockScreen').style.display='flex';
  document.getElementById('app').style.display='none';
}
function exitWithoutSave(){ finishLockApp(); }
async function exitWithSave(){
  const btn=document.getElementById('exitSaveBtn');
  if(btn){ btn.disabled=true; btn.textContent='در حال ذخیره…'; }
  // ذخیره‌ی اصلی برنامه + ثبت همان نسخه در تاریخچه‌ی پشتیبان داخلی برای بازیابی بعدی
  try{
    const snap=snapshotData();
    const json=JSON.stringify(snap);
    storeBackupSnapshot(json, `ذخیره هنگام خروج — ${STATE.patients.length} بیمار`);
    const result=await downloadBlob(
      new TextEncoder().encode(json),
      `پشتیبان-DENTYAR-خروج-${todayJalaliCompact()}-${String(new Date().getHours()).padStart(2,'0')}${String(new Date().getMinutes()).padStart(2,'0')}${String(new Date().getSeconds()).padStart(2,'0')}.json`,
      'application/json',
      {share:false}
    );
    if(result==='saved' || result==='downloaded') toast('اطلاعات در برنامه و نسخه‌ی پشتیبان قابل بازیابی ذخیره شد');
    else if(result==='cancelled') toast('اطلاعات داخل برنامه و نسخه‌ی پشتیبان داخلی ذخیره شد؛ ذخیره در حافظه گوشی لغو شد');
    else toast('اطلاعات داخل برنامه و نسخه‌ی پشتیبان داخلی ذخیره شد؛ ذخیره در حافظه گوشی انجام نشد');
  }catch(e){
    console.error('Exit backup failed',e);
    // حتی در صورت خطای فایل گوشی، ذخیره‌ی داخلی قبلاً انجام شده است.
    saveState();
    toast('اطلاعات داخل برنامه و پشتیبان داخلی ذخیره شد؛ ذخیره فایل گوشی انجام نشد');
  }
  finishLockApp();
}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// Measures the actual rendered height of the fixed header+nav block and applies it
// as top padding on #app, so page content never sits hidden behind the fixed bar —
// this stays correct regardless of how long the clinic name is, how many nav items
// exist, or font-size/zoom differences across devices.
function syncFixedTopHeight(){
  requestAnimationFrame(()=>{
    const h = document.getElementById('fixedTop').offsetHeight;
    document.getElementById('app').style.paddingTop = h + 'px';
  });
}
function navigate(pageId, params){
  closeModal();

  renderPage();
}

/* ===================== داشبورد ===================== */
function renderDashboard(){
  const patients=STATE.patients||[];
  const today=todayISO(), jy=currentJalaliYear();
  const visits=patients.flatMap(p=>(p.visits||[]).map(v=>({p,v})));
  const todayVisits=visits.filter(x=>x.v.date===today).length;
  const todayAppointments=(STATE.appointments||[]).filter(a=>a.date===today).length;
  const yearPatients=patients.filter(p=>p.createdAt && gregorianToJalali(new Date(p.createdAt).getFullYear(),new Date(p.createdAt).getMonth()+1,new Date(p.createdAt).getDate())[0]===jy).length;
  const totalPatients=patients.length;
  const completed=visits.filter(x=>x.v.outcome==='تکمیل‌شده').length;
  const ongoing=visits.filter(x=>x.v.outcome==='در حال درمان').length;
  const referrals=visits.filter(x=>x.v.outcome==='ارجاع‌شده').length;
  const cancelled=visits.filter(x=>x.v.outcome==='لغوشده').length;
  const totals=visits.reduce((a,x)=>{const f=financeOf(x.v);a.gross+=f.gross;a.discount+=f.discount;a.insurance+=f.insurance;a.net+=f.net;a.cash+=f.cash;a.nonCash+=f.card+f.transfer+f.other;a.refund+=f.refund;a.paid+=f.paid;a.balance+=f.balance;return a},{gross:0,discount:0,insurance:0,net:0,cash:0,nonCash:0,refund:0,paid:0,balance:0});
  const typeCounts={}; visits.forEach(x=>{const t=(x.v.treatmentType||'سایر').trim()||'سایر';typeCounts[t]=(typeCounts[t]||0)+1});
  const typeRows=Object.entries(typeCounts).sort((a,b)=>b[1]-a[1]);
  const topTreatment=typeRows[0]?.[0]||'—';
  // Only concise, verified clinical metrics belong on the home dashboard.
  const metricDefs={
    totalPatients:['کل بیماران',totalPatients,'patients',ICON_PEOPLE,'c-teal'],
    newPatients:[`بیماران جدید سال ${jy}`,yearPatients,'patients',ICON_PEOPLE,'c-teal'],
    todayVisits:['مراجعات امروز',todayVisits,'reports',ICON_CLIPBOARD,'c-green'],
    todayAppointments:['نوبت‌های امروز',todayAppointments,'appointments',NAV_ICONS.appointments,'c-gold'],
    treatments:['درمان‌های تکمیل‌شده',completed,'reports',ICON_CHECK,'c-green'],
    ongoing:['درمان‌های در حال انجام',ongoing,'reports',ICON_CLIPBOARD,'c-purple'],
    referrals:['ارجاع‌شده',referrals,'reports',ICON_PEOPLE,'c-navy'],
    cancelled:['لغوشده',cancelled,'reports',ICON_X,'c-red'],
    treatmentCount:['تعداد کل درمان‌ها',visits.length,'reports',ICON_CLIPBOARD,'c-teal'],
    dentists:['دندان‌پزشکان',STATE.dentists.length,'dentists',ICON_PEOPLE,'c-navy']
  };
  const curated=['totalPatients','newPatients','todayVisits','todayAppointments','treatments','ongoing','treatmentCount','dentists'];
  let saved=(STATE.meta.dashboardMetrics||[]).filter(k=>metricDefs[k]);
  // Prevent legacy/broken metric sets from resurrecting stale dashboard labels.
  if(saved.length<4 || saved.some(k=>['completed','levels','surfaces'].includes(k))){ saved=curated; }
  const keys=saved.slice(0,10);
  const statHtml=keys.map(k=>{const d=metricDefs[k];const nav=d[2]==='reports'?"navigate('reports')":`navigate('${d[2]}')`;return `<button type="button" class="statCard ${d[4]} clickable" onclick="${nav}" aria-label="${esc(d[0])}"><span class="iconBadge">${d[3]}</span><span class="num">${esc(faDigits(d[1]))}</span><span class="lbl">${esc(d[0])}</span></button>`}).join('');
  const financeItems=[
    ['مبلغ ناخالص خدمات',totals.gross,'gross'],['تخفیف',totals.discount,'discount'],['سهم بیمه',totals.insurance,'insurance'],
    ['خالص قابل پرداخت',totals.net,'net'],['دریافت نقدی',totals.cash,'cash'],['دریافت غیرنقدی',totals.nonCash,'nonCash'],
    ['استرداد وجه',totals.refund,'refund'],['کل دریافتی',totals.paid,'paid'],['مطالبات / باقیمانده',totals.balance,'balance']
  ];
  const financeHtml=financeItems.map(([label,val,key])=>`<div class="financeItem finance-${key}"><span>${esc(label)}</span><b>${esc(fmtMoney(val))}</b></div>`).join('');
  const servicesHtml=typeRows.length
    ? typeRows.slice(0,8).map(([name,count])=>`<div class="serviceRow"><span>${esc(name)}</span><b>${esc(faDigits(count))}</b></div>`).join('')
    : '<div class="empty">هنوز خدمتی ثبت نشده است</div>';
  document.getElementById('pageContent').innerHTML=`
    <section class="dashboardHero">
      <div><div class="dashboardKicker">DENTYAR · داشبورد مطب</div><h1>${esc(STATE.meta.clinicName||'مطب لبخند زیبا')}</h1><p>نمای کلی عملکرد و وضعیت درمانی مطب در سال ${esc(faDigits(jy))}</p></div>
      <div class="heroTooth">${ICON_TOOTH}</div>
    </section>
    <div class="sectionTitle">شاخص‌های کلیدی</div>
    <section class="statGrid dashboardStats">${statHtml}</section>
    <div class="sectionTitle">خلاصه مالی</div>
    <section class="card financeCard"><div class="financeGrid">${financeHtml}</div></section>
    <div class="sectionTitle">خدمات پرتکرار</div>
    <section class="card servicesCard"><div class="servicesList">${servicesHtml}</div></section>
  `;
}

function buildSmsMessage(template, appt){
  let msg = (template||'')
    .replace(/\{نام\}/g, appt.name||'')
    .replace(/\{تاریخ\}/g, fmtDateFa(appt.date))
    .replace(/\{ساعت\}/g, appt.time||'');
  const footer = [STATE.meta.clinicName, STATE.meta.supportPhone].filter(Boolean).join(' - ');
  return footer? (msg + '\n' + footer) : msg;
}
function openSmsComposer(phone, message){
  const p = toEnDigits(phone||'').replace(/\s+/g,'');
  const url = 'sms:' + encodeURIComponent(p) + '?body=' + encodeURIComponent(message);
  window.location.href = url;
}

function isWithinNextHour(appt){
  if(!appt.date || !appt.time) return false;
  const dt = new Date(appt.date+'T'+appt.time+':00');
  const diffMin = (dt - new Date())/60000;
  return diffMin >= -10 && diffMin <= 60; // تا ۱۰ دقیقه بعد از زمان نوبت هم نمایش داده شود
}

function checkDuplicateNationalId(nid, excludeId){
  if(!nid) return null;
  const n = toEnDigits(nid).trim();
  if(!n) return null;

}
// اعتبارسنجی کد ملی ایرانی بر اساس الگوریتم رسمی چک‌سام (۱۰ رقمی)
function isValidIranianNationalId(nid){
  const n = toEnDigits(nid||'').trim();
  if(!/^\d{10}$/.test(n)) return false;
  if(/^(\d)\1{9}$/.test(n)) return false; // ده رقم یکسان معتبر نیست
  const digits = n.split('').map(Number);
  const check = digits[9];
  let sum = 0;
  for(let i=0;i<9;i++){ sum += digits[i] * (10-i); }
  const remainder = sum % 11;
  return (remainder < 2) ? (check === remainder) : (check === (11-remainder));
}

    <textarea id="pfNotes">${esc(p.notes||'')}</textarea>
    <div id="pfDupWarning" style="color:var(--danger);font-size:12.5px;margin-top:6px;"></div>
    <div class="modalBtns">
      <button class="btn btn-outline" onclick="closeModal()">انصراف</button>
      <button class="btn btn-primary" onclick="savePatientForm(${editing? `'${editing.id}'`:'null'})">ذخیره</button>
    </div>
  `);
  document.getElementById('pfNid').addEventListener('input', function(){
    const v = this.value.trim();
    const dup = checkDuplicateNationalId(v, editing?editing.id:null);
    if(dup){ document.getElementById('pfDupWarning').textContent = `⚠ این کد ملی قبلاً برای «${dup.name}» (پرونده #${dup.fileNo}) ثبت شده است.`; }
    else if(v && !isValidIranianNationalId(v)){ document.getElementById('pfDupWarning').textContent = '⚠ کد ملی معتبر به نظر نمی‌رسد.'; }
    else { document.getElementById('pfDupWarning').textContent = ''; }
  });
}

function savePatientForm(editingId){
  const name = document.getElementById('pfName').value.trim();
  if(!name){ modalAlert('خطا','نام بیمار الزامی است.'); return; }
  const enteredNid=toEnDigits(document.getElementById('pfNid').value||'').trim();
  if(enteredNid){
    const duplicate=checkDuplicateNationalId(enteredNid,editingId);
    if(duplicate){ modalAlert('ثبت تکراری','این کد ملی قبلاً برای «'+esc(duplicate.name)+'» با شماره پرونده '+esc(duplicate.fileNo)+' ثبت شده است.'); return; }
  }
  const enteredPhone=toEnDigits(String(document.getElementById('pfPhone').value||'')).replace(/\D/g,'');
  const samePatient=(STATE.patients||[]).find(p=>p.id!==editingId && String(p.name||'').trim().toLowerCase()===name.toLowerCase() && enteredPhone.length>=7 && toEnDigits(String(p.phone||'')).replace(/\D/g,'')===enteredPhone);
  if(samePatient){ modalAlert('احتمال ثبت تکراری','بیماری با همین نام و شماره تماس قبلاً ثبت شده است (پرونده '+esc(samePatient.fileNo)+').'); return; }
  const data = {
    name,
    nationalId: document.getElementById('pfNid').value.trim(),
    phone: document.getElementById('pfPhone').value.trim(),
    gender: document.getElementById('pfGender').value,
    birthYear: document.getElementById('pfBirth').value.trim(),
    insuranceType: document.getElementById('pfBaseInsurance').value,
    baseInsurance: document.getElementById('pfBaseInsurance').value,
    supplementalInsurance: document.getElementById('pfSupplementalInsurance').value,
    insuranceNumber: document.getElementById('pfInsuranceNo').value.trim(),
    policyNumber: document.getElementById('pfPolicyNo').value.trim(),
    coverageCeiling: moneyVal('pfCoverageCeiling'),
    franchisePercent: Number(document.getElementById('pfFranchise').value)||0,
    visitType: document.getElementById('pfVisitType').value,
    address: document.getElementById('pfAddress').value.trim(),
    notes: document.getElementById('pfNotes').value.trim(),
  };
  const cost = Number(toEnDigits(document.getElementById('pfCost').value)) || 0;
  if(editingId){
    const p = STATE.patients.find(x=>x.id===editingId);
    Object.assign(p, data);
    p.visits = p.visits || [];
    if(p.visits.length){
      p.visits[0].cost = cost;
    } else if(cost > 0){
      p.visits.push({id:uid('v'), date:todayISO(), treatmentType:STATE.lists.treatmentTypes[0]||'مشاوره', dentistId:'', outcome:STATE.lists.outcomes[0]||'تکمیل‌شده', cost, note:'', createdAt:Date.now()});
    }
  } else {
    const visits = cost > 0 ? [{id:uid('v'), date:todayISO(), treatmentType:STATE.lists.treatmentTypes[0]||'مشاوره', dentistId:'', outcome:STATE.lists.outcomes[0]||'تکمیل‌شده', cost, note:'', createdAt:Date.now()}] : [];
    STATE.patients.push({
      id: uid('pt'), fileNo: nextFileNo(), createdAt: Date.now(),
      visits, files: [], ...data
    });
  }
  saveState();
  closeModal();
  toast('اطلاعات بیمار ذخیره شد');
  renderPatients();
}

function deletePatient(id){
  modalConfirm('حذف بیمار','آیا از حذف کامل این بیمار و تاریخچه‌ی او مطمئن هستید؟ این عمل قابل بازگشت نیست.', ()=>{
    STATE.patients = STATE.patients.filter(p=>p.id!==id);

}

function addVisit(patientId){

  if(!p) return;
  p.visits = p.visits || [];
  p.visits.push({
    id: uid('vs'),
    date: document.getElementById('vDate').value || todayISO(),
    cost: moneyVal('vGross'),
    grossAmount: moneyVal('vGross'),
    discount: moneyVal('vDiscount'),
    insuranceShare: moneyVal('vInsurance'),
    netAmount: calcVisitFinance('v').net,
    cashPaid: moneyVal('vCash'),
    cardPaid: moneyVal('vCard'),
    transferPaid: moneyVal('vTransfer'),
    otherPaid: moneyVal('vOther'),
    refund: moneyVal('vRefund'),
    paidAmount: calcVisitFinance('v').paid,
    balance: calcVisitFinance('v').balance,
    paymentType: document.getElementById('vPaymentType').value,
    dentistId: document.getElementById('vDentist').value,
    treatmentType: document.getElementById('vType').value,
    treatmentServices: selectedServiceValues('v'),

    const p = STATE.patients.find(x=>x.id===patientId);
    p.visits = (p.visits||[]).filter(v=>v.id!==visitId);
    saveState(); renderPatientFile(patientId); toast('حذف شد');
  });

function handleFileAttach(patientId, fileList){
  const p = STATE.patients.find(x=>x.id===patientId);
  if(!p) return;
  p.files = p.files || [];
  const readers = Array.from(fileList).map(file=> new Promise(res=>{
    const reader = new FileReader();
    reader.onload = ()=> res({name:file.name, type:file.type, data:reader.result});
    reader.readAsDataURL(file);
  }));
  Promise.all(readers).then(results=>{
    p.files.push(...results);
    saveState();
    renderPatientFile(patientId);
    toast('فایل(ها) پیوست شد');
  });
}
function removePatientFile(patientId, idx){
  const p = STATE.patients.find(x=>x.id===patientId);
  modalConfirm('حذف فایل','آیا از حذف این فایل مطمئن هستید؟', ()=>{
    p.files.splice(idx,1);
    saveState(); renderPatientFile(patientId);
  });

function saveBulkDentists(){

  rows = rows.filter(r=>{
    const p = r.patient, v = r.visit;

    if(f.treatmentType && (!v || v.treatmentType!==f.treatmentType)) return false;
    if(f.outcome && (!v || v.outcome!==f.outcome)) return false;
    if(f.dentistId && (!v || v.dentistId!==f.dentistId)) return false;

  const body = rows.map(r=>{

async function exportReportCSV(){

  try{

    const action =
      await dentyarReportAction();

    if(action === 'cancel'){

      return;

    }

    const result =
      await exportRowsAsCSV(

        getReportRowsForExport(),

        'گزارش-' +
        todayJalaliCompact() +
        '.csv',

        {
          share:
            action === 'share'
        }

      );

    if(result === 'cancelled'){

      return;

    }

    if(result === 'saved'){

      toast(
        'فایل CSV با موفقیت ذخیره شد'
      );

      return;

    }

    if(result === 'shared'){

      toast(
        'فایل CSV برای ذخیره یا ارسال آماده شد'
      );

      return;

    }

    throw new Error(
      'CSV export returned invalid result'

  }catch(e){

    console.error(
      'DENTYAR CSV export error:',
      e
    );

    toast(
      'خطا در ساخت یا ذخیره فایل CSV'
    );

  }

}

function snapshotData(){
  // پشتیبان کامل از وضعیت برنامه؛ تاریخچه‌ی محلی پشتیبان‌ها عمداً داخل فایل خروجی نمی‌رود،
  // چون کلیدهای localStorage آن دستگاه روی دستگاه دیگر وجود ندارد.
  const full = JSON.parse(JSON.stringify(STATE));
  delete full.backupHistory;
  return {
    version:2, exportedAt: Date.now(), clinicName: STATE.meta?.clinicName || 'DENTYAR',
    data: full
  };
}

function storeBackupSnapshot(json, note){
  const id = uid('bk');
  try{ localStorage.setItem(BACKUP_STORE_PREFIX+id, json); }catch(e){ console.warn('local snapshot save failed', e); }
  STATE.backupHistory = STATE.backupHistory || [];
  STATE.backupHistory.push({id, ts:Date.now(), note:note || `${STATE.patients.length} بیمار`, snapshotSize:json.length});
  // فقط 20 نسخه‌ی آخر در حافظه‌ی داخلی نگه داشته می‌شود تا حجم برنامه بی‌دلیل افزایش پیدا نکند.
  if(STATE.backupHistory.length>20){
    const removed = STATE.backupHistory.splice(0, STATE.backupHistory.length-20);
    removed.forEach(r=>{ try{ localStorage.removeItem(BACKUP_STORE_PREFIX+r.id); }catch(e){} });
  }
  saveState();
  return id;
}

async function createBackup(){
  const snap = snapshotData();
  const json = JSON.stringify(snap);
  storeBackupSnapshot(json, `${STATE.patients.length} بیمار`);
  const result=await downloadBlob(new TextEncoder().encode(json), `پشتیبان-DENTYAR-${todayJalaliCompact()}-${String(new Date().getHours()).padStart(2,'0')}${String(new Date().getMinutes()).padStart(2,'0')}${String(new Date().getSeconds()).padStart(2,'0')}.json`, 'application/json', {share:false});
  toast(result==='shared'?'پشتیبان آماده ذخیره یا ارسال شد':result==='cancelled'?'ارسال لغو شد':'فایل پشتیبان آماده دریافت است');
  renderBackup();
}

function restoreFromHistory(id, mode){
  const raw = localStorage.getItem(BACKUP_STORE_PREFIX+id);
  if(!raw){ modalAlert('خطا','این نسخه‌ی پشتیبان در این مرورگر یافت نشد (شاید حافظه پاک شده). از فایل دانلودشده استفاده کنید.'); return; }
  const snap = JSON.parse(raw);
  performRestore(snap, mode);
}

function handleRestoreFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    let snap;
    try{ snap = JSON.parse(reader.result); }
    catch(e){ modalAlert('خطا','فایل انتخاب‌شده معتبر نیست.'); return; }
    modalConfirm('نحوه‌ی بازیابی','می‌خواهید اطلاعات این فایل با اطلاعات فعلی «ادغام» شود یا اطلاعات فعلی به‌طور کامل «جایگزین» شود؟',
      ()=>performRestore(snap,'merge'), 'ادغام', 'btn-outline');
    setTimeout(()=>{
      const box = document.querySelector('.modalBtns');
      if(box){
        const replaceBtn = document.createElement('button');
        replaceBtn.className='btn btn-danger'; replaceBtn.textContent='جایگزینی کامل';
        replaceBtn.onclick = ()=>{ closeModal(); performRestore(snap,'replace'); };
        box.appendChild(replaceBtn);
      }
    }, 50);
  };
  reader.readAsText(file);
}

function performRestore(snap, mode){
  if(!snap || !snap.data){ modalAlert('خطا','ساختار فایل پشتیبان نامعتبر است.'); return; }
  const incoming = snap.data;
  if(mode==='replace'){
    STATE.patients = incoming.patients || [];
    STATE.dentists = incoming.dentists || [];
    STATE.appointments = incoming.appointments || [];
    STATE.lists = incoming.lists || STATE.lists;
    STATE.meta = {...STATE.meta, ...(incoming.meta||{})};
    STATE.formFields = incoming.formFields || STATE.formFields;
    STATE.treatmentPrices = incoming.treatmentPrices || STATE.treatmentPrices || {};
  } else { // merge
    const byId = (arr)=> new Map(arr.map(x=>[x.id,x]));
    const mergeArr = (current, incoming)=>{
      const map = byId(current);
      (incoming||[]).forEach(item=>{ map.set(item.id, item); }); // incoming overwrites same-id, adds new
      return Array.from(map.values());
    };
    STATE.patients = mergeArr(STATE.patients, incoming.patients);
    STATE.dentists = mergeArr(STATE.dentists, incoming.dentists);
    STATE.appointments = mergeArr(STATE.appointments, incoming.appointments);
    if(incoming.lists){
      Object.keys(incoming.lists).forEach(k=>{
        const set = new Set([...(STATE.lists[k]||[]), ...(incoming.lists[k]||[])]);
        STATE.lists[k] = Array.from(set);
      });
    }
    STATE.formFields = {...(STATE.formFields||{}), ...(incoming.formFields||{})};
    STATE.treatmentPrices = {...(STATE.treatmentPrices||{}), ...(incoming.treatmentPrices||{})};
  }
  saveState();
  toast(mode==='replace'? 'اطلاعات جایگزین شد' : 'اطلاعات ادغام شد');
  navigate('dashboard');
}

/* ---------- ارسال برنامه به دستگاه دیگر ---------- */
async function shareAppTransfer(withData){
  const htmlTemplate=document.documentElement.outerHTML;
  let finalHtml=htmlTemplate;
  const dataToEmbed=withData ? DEFAULT_STATE_MERGE() : DEFAULT_STATE();
  const declPrefix='const EMBEDDED_STATE = '+'___LB_BOOT'+'_STATE_SENTINEL___;';
  const declReplacement='const EMBEDDED_STATE = '+JSON.stringify(dataToEmbed)+';';
  const lastIdx=finalHtml.lastIndexOf(declPrefix);
  if(lastIdx!==-1) finalHtml=finalHtml.slice(0,lastIdx)+declReplacement+finalHtml.slice(lastIdx+declPrefix.length);
  const bytes=new TextEncoder().encode(finalHtml);
  const fileName=withData?'DENTYAR-انتقال-با-اطلاعات.html':'DENTYAR-انتقال-خالی.html';
  const result=await downloadBlob(bytes,fileName,'text/html;charset=utf-8',{share:true});
  if(result==='shared') toast('فایل انتقالی DENTYAR برای ارسال باز شد');
  else if(result==='saved') toast('فایل انتقالی در Documents/DENTYAR ذخیره شد');
  else if(result==='downloaded') toast('فایل انتقالی آماده دانلود است');
  else if(result==='cancelled') toast('ارسال لغو شد');
  return result;
}

async function exportAppTransfer(withData){
  // Rebuild a full standalone HTML using current DOC as template, embedding (or clearing) state.
  const htmlTemplate = document.documentElement.outerHTML;
  let finalHtml = htmlTemplate;
  const dataToEmbed = withData ? DEFAULT_STATE_MERGE() : DEFAULT_STATE();
  // IMPORTANT: build the search string via concatenation so this exact contiguous
  // substring never appears verbatim in this function's own source text — otherwise
  // String.replace (which matches the FIRST occurrence) would wrongly match itself
  // here instead of the real bootstrap line near the end of the document.
  const declPrefix = 'const EMBEDDED_STATE = ' + '___LB_BOOT' + '_STATE_SENTINEL___;';
  const declReplacement = 'const EMBEDDED_STATE = ' + JSON.stringify(dataToEmbed) + ';';
  const lastIdx = finalHtml.lastIndexOf(declPrefix);
  if(lastIdx !== -1){
    finalHtml = finalHtml.slice(0,lastIdx) + declReplacement + finalHtml.slice(lastIdx+declPrefix.length);
  }
  const bytes = new TextEncoder().encode(finalHtml);
  const result=await downloadBlob(bytes, withData? 'DENTYAR-انتقال-با-اطلاعات.html' : 'DENTYAR-انتقال-خالی.html', 'text/html;charset=utf-8', {share:false});
  toast(result==='shared'?'فایل انتقالی آماده ذخیره یا ارسال شد':result==='cancelled'?'ارسال لغو شد':'فایل انتقالی آماده دریافت است');
}
function DEFAULT_STATE_MERGE(){
  return { meta:STATE.meta, patients:STATE.patients, dentists:STATE.dentists, appointments:STATE.appointments, lists:STATE.lists, backupHistory:[] };
}

function refreshDentyarWeb(){
  try{ if('serviceWorker' in navigator){ navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.update())).catch(()=>{}); } }catch(e){}
  try{ if('caches' in window){ caches.keys().then(keys=>Promise.all(keys.filter(k=>/^dentyar-/i.test(k)).map(k=>caches.delete(k)))).finally(()=>location.replace(location.href.split('#')[0]+'?v='+Date.now())); return; } }catch(e){}

function getDentyarPlatform(){
  try{
    if(window.Capacitor && typeof window.Capacitor.isNativePlatform==='function' && window.Capacitor.isNativePlatform()){
      return String(window.Capacitor.getPlatform?.()||'android').toLowerCase();
    }
  }catch(e){}
  const ua=navigator.userAgent||'';
  if(/iPhone|iPad|iPod/i.test(ua)) return 'ios';
  if(/Android/i.test(ua)) return 'android-web';
  if(/Windows/i.test(ua)) return 'windows';
  if(/Macintosh|Mac OS X/i.test(ua)) return 'macos';
  if(/Linux/i.test(ua)) return 'linux';
  return 'web';
}

async function checkAndApplyWebUpdate(){
  const badge=document.getElementById('dentyarPlatformBadge');
  if(badge) badge.textContent='در حال بررسی…';
  const manifestUrl='https://raw.githubusercontent.com/dentyarapp/DENTYAR-V1/test/dentyar-comprehensive-fixes-20261009/update.json?ts='+Date.now();
  try{
    const res=await fetch(manifestUrl,{cache:'no-store',headers:{'Accept':'application/json'}});
    if(!res.ok) throw new Error('update manifest '+res.status);
    const remote=await res.json();
    const remoteVersion=String(remote.version||'').toUpperCase();
    const current=String(DENTYAR_APP_VERSION||'V57').toUpperCase();
    if(!remoteVersion){throw new Error('missing version');}
    const num=v=>Number(String(v).replace(/[^0-9]/g,''))||0;
    if(num(remoteVersion)<=num(current)){
      if(badge) badge.textContent=getDentyarPlatform();
      modalAlert('بروزرسانی DENTYAR',`نسخه فعلی ${faDigits(current)} است و بروزرسانی جدیدی منتشر نشده است.`);
      return;
    }
    const ok=confirm(`نسخه ${remoteVersion} آماده است. بروزرسانی وب انجام شود؟`);
    if(!ok) return;
    // The web/PWA update is always applied on the same deployment URL so the clinic data remains local.
    if('serviceWorker' in navigator){
      for(const reg of await navigator.serviceWorker.getRegistrations()){
        try{await reg.update(); if(reg.waiting){reg.waiting.postMessage({type:'SKIP_WAITING'}); await new Promise(r=>setTimeout(r,250));}}catch(e){}
      }
    }
    if('caches' in window){for(const k of await caches.keys()){if(/^dentyar-/i.test(k)) await caches.delete(k);}}
    location.replace(location.href.split('#')[0]+'?v='+Date.now());
  }catch(e){
    console.error('DENTYAR web update check failed',e);
    if(badge) badge.textContent=getDentyarPlatform();
    modalAlert('بروزرسانی DENTYAR','بررسی بروزرسانی انجام نشد. فایل update.json باید در مخزن اصلی DENTYAR قرار داشته باشد و اتصال اینترنت فعال باشد.');
  }
}

/* آپلود دستی فایل index.html اصلاح‌شده از بخش تنظیمات.
   این قابلیت فقط برای نسخه وب/PWA (اجرا از https:// یا localhost) کار می‌کند؛
   در نسخه‌ی نصب‌شده‌ی Android (Capacitor)، فایل برنامه از داخل بسته‌ی APK بارگذاری می‌شود
   و از طریق جاوااسکریپت صفحه قابل جایگزینی نیست — برای آن نسخه، بخش «بسته Android (APK)»
   همین صفحه (که پیش‌تر وجود داشت) استفاده می‌شود.
   داده‌های بیماران/نوبت‌ها/تنظیمات (localStorage و IndexedDB) به آدرس برنامه وابسته‌اند،
   نه به فایل HTML؛ بنابراین با این جایگزینی از بین نمی‌روند. */
async function applyHtmlFileUpdate(){
  const badge=document.getElementById('htmlUpdateStateBadge');
  const input=document.getElementById('htmlUpdateFileInput');
  const file=input?.files?.[0];

  const C=window.Capacitor;
  if(C && C.isNativePlatform && C.isNativePlatform()){
    modalAlert('آپلود فایل اصلاح‌شده','در نسخه نصب‌شده Android، فایل برنامه از داخل بسته APK اجرا می‌شود و از طریق تنظیمات قابل جایگزینی نیست. برای این نسخه از بخش «بسته Android (APK)» استفاده کنید؛ آپلود فایل index.html فقط برای نسخه وب/PWA کار می‌کند.');
    return;
  }
  if(!file){ modalAlert('آپلود فایل اصلاح‌شده','ابتدا فایل index.html جدید را انتخاب کنید.'); return; }
  if(!/\.html?$/i.test(file.name)){ modalAlert('آپلود فایل اصلاح‌شده','فقط فایل با پسوند html/htm مجاز است.'); return; }
  if(!('caches' in window) || !('serviceWorker' in navigator)){
    modalAlert('آپلود فایل اصلاح‌شده','این مرورگر از بروزرسانی آفلاین (Cache API/Service Worker) پشتیبانی نمی‌کند.');
    return;
  }
  if(!confirm('فایل انتخاب‌شده جایگزین نسخه فعلی برنامه می‌شود و صفحه بارگذاری مجدد می‌شود. اطلاعات بیماران و تنظیمات حفظ می‌شود. ادامه می‌دهید؟')) return;

  if(badge) badge.textContent='در حال خواندن فایل…';
  try{
    const newHtml=await file.text();
    if(!/<html/i.test(newHtml)){ throw new Error('invalid html content'); }

    if(badge) badge.textContent='در حال جایگزینی…';
    const scopeUrl=location.href.split('#')[0].split('?')[0];
    const cacheKeys=await caches.keys();
    const dentyarCacheKeys=cacheKeys.filter(k=>/^dentyar-/i.test(k));
    // اگر کش DENTYAR موجود بود همان‌ها به‌روزرسانی می‌شوند؛ در غیر این صورت یک کش موقت ساخته می‌شود
    // تا Service Worker فعلی (که خودش کش‌های dentyar-* را کنترل می‌کند) نسخه‌ی جدید را سرو کند.
    const targetCacheNames = dentyarCacheKeys.length ? dentyarCacheKeys : ['dentyar-manual-html-update'];
    for(const cacheName of targetCacheNames){
      const cache=await caches.open(cacheName);
      await cache.put(scopeUrl, new Response(newHtml, {headers:{'Content-Type':'text/html; charset=utf-8'}}));
      await cache.put(scopeUrl.replace(/\/[^/]*$/, '/index.html'), new Response(newHtml, {headers:{'Content-Type':'text/html; charset=utf-8'}}));
    }
    for(const reg of await navigator.serviceWorker.getRegistrations()){
      try{ await reg.update(); }catch(_){}
    }
    if(badge) badge.textContent='با موفقیت جایگزین شد';
    toast('فایل اصلاح‌شده اعمال شد؛ صفحه بارگذاری مجدد می‌شود');
    setTimeout(()=>{ location.replace(scopeUrl+'?v='+Date.now()); }, 600);
  }catch(err){
    console.error('DENTYAR manual HTML update failed', err);
    if(badge) badge.textContent='خطا';
    modalAlert('آپلود فایل اصلاح‌شده','جایگزینی فایل انجام نشد. مطمئن شوید فایل انتخاب‌شده یک index.html معتبر است.');
  }
}

async function checkAndInstallAndroidUpdate(){
  const badge=document.getElementById('updateStateBadge');
  if(badge) badge.textContent='در حال بررسی…';
  try{
    const r=await fetch('https://raw.githubusercontent.com/dentyarapp/DENTYAR-V1/test/dentyar-comprehensive-fixes-20261009/update.json?ts='+Date.now(),{cache:'no-store',headers:{'Accept':'application/json'}});
    if(!r.ok) throw new Error('manifest '+r.status);
    const m=await r.json();
    const remoteVersion=String(m.version||m.android?.version||'').toUpperCase();
    const current=String(DENTYAR_APP_VERSION||'V57').toUpperCase();
    const num=v=>Number(String(v).replace(/[^0-9]/g,''))||0;
    if(!remoteVersion || num(remoteVersion)<=num(current)){
      if(badge) badge.textContent='به‌روز';
      modalAlert('بروزرسانی DENTYAR',`نسخه نصب‌شده ${faDigits(current)} است و نسخه جدیدی منتشر نشده است.`);
      return;
    }
    const apkUrl=String(m.android?.apkUrl||m.apkUrl||'').trim();
    if(!apkUrl) throw new Error('missing apkUrl');
    if(!confirm(`نسخه ${remoteVersion} آماده نصب است. دریافت و نصب انجام شود؟`)) return;
    if(badge) badge.textContent='در حال دریافت APK…';
    const ar=await fetch(apkUrl,{cache:'no-store'});
    if(!ar.ok) throw new Error('apk '+ar.status);
    const blob=await ar.blob();
    const fileName=String(m.android?.fileName||('DENTYAR-'+remoteVersion+'.apk')).replace(/[\\/:*?"<>|]/g,'_');
    await new Promise((resolve,reject)=>{
      const req=indexedDB.open('dentyar_updates_v1',1);
      req.onupgradeneeded=e=>{if(!e.target.result.objectStoreNames.contains('updates'))e.target.result.createObjectStore('updates',{keyPath:'id'});};
      req.onerror=()=>reject(req.error||new Error('IDB open failed'));
      req.onsuccess=e=>{
        const db=e.target.result,tx=db.transaction('updates','readwrite');
        tx.objectStore('updates').put({id:'latest',version:remoteVersion,note:m.notes||'',fileName,size:blob.size,blob,savedAt:Date.now()});
        tx.oncomplete=()=>{db.close();resolve();};
        tx.onerror=()=>{db.close();reject(tx.error||new Error('IDB write failed'));};
      };
    });
    if(badge) badge.textContent='نسخه دریافت شد';
    const info=document.getElementById('savedUpdateInfo');
    if(info) info.textContent=`نسخه ${remoteVersion} | ${fileName} | ${Math.round(blob.size/1024)} کیلوبایت`;
    await executeSavedAppUpdate();
  }catch(e){
    console.error('DENTYAR Android update failed',e);
    if(badge) badge.textContent='خطا';
    modalAlert('بروزرسانی Android','دریافت یا نصب خودکار انجام نشد. بررسی کنید اینترنت فعال باشد و آخرین APK در بخش Releases مخزن DENTYAR منتشر شده باشد.');
  }
}

function saveAppUpdatePackage(){
  const input=document.getElementById('updateApkInput');
  const file=input?.files?.[0];
  const version=(document.getElementById('updateVersionInput')?.value||'').trim().toUpperCase();
  const note=(document.getElementById('updateNoteInput')?.value||'').trim();
  if(!file){ modalAlert('بروزرسانی','ابتدا فایل APK نسخه جدید را انتخاب کنید.'); return; }
  if(!/\.apk$/i.test(file.name)){ modalAlert('بروزرسانی','فقط فایل APK مجاز است.'); return; }
  if(!version){ modalAlert('بروزرسانی','شماره نسخه جدید را وارد کنید؛ مانند V57.'); return; }
  const badge=document.getElementById('updateStateBadge');
  badge.textContent='در حال ذخیره…';
  const reader=new FileReader();
  reader.onload=()=>{
    const blob=new Blob([reader.result],{type:'application/vnd.android.package-archive'});
    const req=indexedDB.open('dentyar_updates_v1',1);
    req.onupgradeneeded=e=>{ if(!e.target.result.objectStoreNames.contains('updates')) e.target.result.createObjectStore('updates',{keyPath:'id'}); };
    req.onerror=()=>{ badge.textContent='خطا'; modalAlert('بروزرسانی','ذخیره فایل ممکن نشد.'); };
    req.onsuccess=e=>{
      const db=e.target.result; const tx=db.transaction('updates','readwrite');
      tx.objectStore('updates').put({id:'latest',version,note,fileName:file.name,size:file.size,blob,savedAt:Date.now()});
      tx.oncomplete=()=>{
        badge.textContent='نسخه آماده';
        const info=document.getElementById('savedUpdateInfo');
        info.textContent=`نسخه ${version} | ${file.name} | ${Math.round(file.size/1024)} کیلوبایت${note?' | '+note:''}`;
        toast('فایل بروزرسانی ذخیره شد');
        db.close();
      };
      tx.onerror=()=>{ badge.textContent='خطا'; modalAlert('بروزرسانی','ذخیره فایل انجام نشد.'); db.close(); };
    };
  };
  reader.readAsArrayBuffer(file);
}
async function executeSavedAppUpdate(){
  const req=indexedDB.open('dentyar_updates_v1',1);
  req.onupgradeneeded=e=>{ if(!e.target.result.objectStoreNames.contains('updates')) e.target.result.createObjectStore('updates',{keyPath:'id'}); };
  req.onsuccess=async e=>{
    const db=e.target.result; const tx=db.transaction('updates','readonly');
    tx.objectStore('updates').get('latest').onsuccess=async ev=>{
      const rec=ev.target.result;
      if(!rec){ modalAlert('بروزرسانی','هنوز فایل APK نسخه جدید ذخیره نشده است.'); db.close(); return; }
      try{
        const C=window.Capacitor;
        if(C && C.isNativePlatform && C.isNativePlatform()){
          const nativePlugin=(C.Plugins&&C.Plugins.DentyarNative)||(C.registerPlugin?C.registerPlugin('DentyarNative'):null);
          if(!nativePlugin || typeof nativePlugin.installApk!=='function') throw new Error('Native APK installer is unavailable');
          const arr=new Uint8Array(await rec.blob.arrayBuffer());
          let binary=''; const chunk=0x8000;
          for(let p=0;p<arr.length;p+=chunk) binary+=String.fromCharCode.apply(null,arr.subarray(p,p+chunk));
          const data=btoa(binary);
          const safeName=String(rec.fileName||('DENTYAR-'+rec.version+'.apk')).replace(/[\\/:*?"<>|]/g,'_');
          await nativePlugin.installApk({filename:safeName,data});
          toast('درخواست نصب به اندروید ارسال شد؛ نصب فقط پس از تأیید سیستم انجام می‌شود.');
        }else{
          const url=URL.createObjectURL(rec.blob);
          const a=document.createElement('a'); a.href=url; a.download=rec.fileName||('DENTYAR-'+rec.version+'.apk'); a.rel='noopener';
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(()=>URL.revokeObjectURL(url),120000);
          toast('فایل APK برای دانلود آماده شد؛ نصب APK فقط در Android انجام می‌شود');
        }
      }catch(err){
        console.error('DENTYAR APK install failed',err);
        modalAlert('نصب بروزرسانی','فایل APK آماده شد، اما اجرای نصب خودکار انجام نشد. دوباره «اجرای نصب Android» را بزنید.');
      }finally{ db.close(); }
    };
  };
}
function downloadSavedAppUpdate(){
  const req=indexedDB.open('dentyar_updates_v1',1);
  req.onupgradeneeded=e=>{ if(!e.target.result.objectStoreNames.contains('updates')) e.target.result.createObjectStore('updates',{keyPath:'id'}); };
  req.onsuccess=e=>{
    const db=e.target.result; const tx=db.transaction('updates','readonly');
    tx.objectStore('updates').get('latest').onsuccess=ev=>{
      const rec=ev.target.result;
      if(!rec){ modalAlert('بروزرسانی','هنوز فایل بروزرسانی ذخیره نشده است.'); db.close(); return; }
      const url=URL.createObjectURL(rec.blob);
      const a=document.createElement('a'); a.href=url; a.download=rec.fileName||('DENTYAR-'+rec.version+'.apk'); a.click();
      setTimeout(()=>URL.revokeObjectURL(url),60000);
      toast('فایل بروزرسانی آماده دریافت است'); db.close();
    };
  };
}
function loadSavedUpdateInfo(){
  const el=document.getElementById('savedUpdateInfo'); if(!el) return;
  const req=indexedDB.open('dentyar_updates_v1',1);
  req.onupgradeneeded=e=>{ if(!e.target.result.objectStoreNames.contains('updates')) e.target.result.createObjectStore('updates',{keyPath:'id'}); };
  req.onsuccess=e=>{ const db=e.target.result; const tx=db.transaction('updates','readonly'); tx.objectStore('updates').get('latest').onsuccess=ev=>{ const r=ev.target.result; if(r){ el.textContent=`نسخه ${r.version} | ${r.fileName} | ${Math.round(r.size/1024)} کیلوبایت${r.note?' | '+r.note:''}`; document.getElementById('updateStateBadge').textContent='نسخه آماده'; } db.close(); }; };

  <div id="lockScreen" data-no-fa-digits="true"></div>

<script>
/* حالت جاسازی‌شده برای «ارسال برنامه به دستگاه دیگر» — در کپی صادرشده جایگزین می‌شود */
const ___LB_BOOT_STATE_SENTINEL___ = null;
const EMBEDDED_STATE = ___LB_BOOT_STATE_SENTINEL___;

window.addEventListener('DOMContentLoaded', function(){
  loadState();
startDentyarIDBMirror();
  // رنگ‌آمیزی نوار وضعیت بالای اندروید (System Status Bar) با همان فیروزه‌ای تیره‌ی برنامه.
  // توجه: نوار پایین سیستم (System Navigation Bar) با CSS یا این افزونه قابل رنگ‌آمیزی نیست؛
  // آن بخش نیاز به تغییر کد بومی اندروید (MainActivity) دارد که خارج از این فایل است.
  try{
    const C=window.Capacitor;
    if(C && C.isNativePlatform && C.isNativePlatform() && C.Plugins && C.Plugins.StatusBar){
      C.Plugins.StatusBar.setBackgroundColor({color:'#eef1f6'}).catch(()=>{});
      C.Plugins.StatusBar.setStyle({style:'LIGHT'}).catch(()=>{});
    }
  }catch(_){}
  if(EMBEDDED_STATE){
    // Only apply embedded state on very first load of a transferred copy (no existing localStorage yet was already handled by loadState default)
    // If this file was opened as a transfer copy and localStorage is empty/default, seed it.
    const isFreshDefault = STATE.patients.length===0 && STATE.dentists.length===0 && STATE.appointments.length===0 && !localStorage.getItem('lb_seeded_'+APP_KEY);
    if(isFreshDefault){
      STATE = {...DEFAULT_STATE(), ...EMBEDDED_STATE};
      saveState();
      localStorage.setItem('lb_seeded_'+APP_KEY, '1');
    }
  }
  renderLock();
  renderHeader();
  renderBottomNav();
  renderPage();
  // اطمینان از فارسی‌سازی اعداد در همان اولین رندر (صفحه ورود، هدر، صفحه اول)،
  // مستقل از زمان‌بندی MutationObserver که در اسکریپت جداگانه‌ی پایین صفحه تعریف شده است.
  if(typeof toFaTextNodeTree==='function') toFaTextNodeTree(document.body);
  if(typeof formatAllNumericInputs==='function') formatAllNumericInputs();

  if(sessionStorage.getItem('lb_unlocked')==='1'){
    document.getElementById('lockScreen').style.display='none';
    document.getElementById('app').style.display='block';
  } else {
    document.getElementById('app').style.display='none';
  }

    if(e.target === this) closeModal();
