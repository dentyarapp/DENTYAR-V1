      const response=await fetch(LICENSE_API_URL+'/v1/activation/request',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({clinicCode:cfg.clinicCode,deviceId:id,deviceName:cfg.deviceName,appVersion:'101-license-trial'})});
      const data=await response.json();
      if(!response.ok) throw new Error(data.error||'ثبت درخواست فعال‌سازی ناموفق بود.');
      toast('درخواست فعال‌سازی ثبت شد. '+(data.emailNotified?'اطلاع مالک از طریق ایمیل ارسال شد.':'مالک باید درخواست را در پنل مدیریت بررسی کند.')+' شناسه پیگیری: '+data.requestId);
      renderSettings();
    }catch(error){toast(error.message||'خطا در ثبت درخواست فعال‌سازی.');}
  };
  SYNC.redeemLicense = async function(){
    try{
      const cfg=SYNC.readForm();
      const code=String((document.getElementById('syncActivationCode')||{}).value||'').trim().toUpperCase();
      if(!/^[A-Z0-9]{16}$/.test(code)){toast('کد فعال‌سازی باید ۱۶ نویسه انگلیسی معتبر باشد.');return;}
      if(!cfg.clinicCode || !cfg.deviceName || !cfg.firebaseConfig.apiKey || !cfg.firebaseConfig.databaseURL || !cfg.firebaseConfig.appId){toast('اطلاعات مطب، دستگاه و Firebase را کامل کنید.');return;}
      if(cfg.firebaseConfig.projectId!=='dentyar-458d9' || cfg.firebaseConfig.databaseURL.replace(/\/$/,'')!=='https://dentyar-458d9-default-rtdb.firebaseio.com'){toast('این مجوز فقط برای پروژه رسمی Firebase دنت‌یار صادر می‌شود.');return;}
      cfg.clinicCode=String(cfg.clinicCode||'').trim()
        .replace(/[۰-۹٠-٩]/g,ch=>String(ch.charCodeAt(0)>=0x06F0&&ch.charCodeAt(0)<=0x06F9?ch.charCodeAt(0)-0x06F0:ch.charCodeAt(0)-0x0660))
        .toUpperCase();
      STATE.meta.sync=Object.assign({enabled:false,clinicCode:'',deviceName:'',firebaseConfig:null,lastSyncAt:null,pairedAt:null},cfg,{enabled:false,pairedAt:null});
      saveState();
      const id=await ensureDeviceId();
      const response=await fetch(LICENSE_API_URL+'/v1/activation/redeem',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code,clinicCode:cfg.clinicCode,deviceId:id})});
      const data=await response.json();
      if(!response.ok) throw new Error(data.error||'کد فعال‌سازی معتبر نیست یا قبلاً استفاده شده است.');
      if(!data.customToken) throw new Error('پاسخ سرویس فعال‌سازی ناقص است؛ کد مصرف نشدنی نیست، دوباره تلاش کنید.');
      STATE.meta.sync.enabled=true;STATE.meta.sync.pairedAt=Date.now();saveState();
      SYNC.disconnect();
      SYNC._licenseCustomToken=data.customToken;
      const codeField=document.getElementById('syncActivationCode');if(codeField)codeField.value='';
      await SYNC.connect();
      renderSettings();
      if(SYNC.isReady()) toast('مجوز تأیید شد و اتصال دنت‌یار برقرار گردید.');
      else toast('مجوز ثبت شد؛ وضعیت اتصال: '+SYNC.diagnosticText());
    }catch(error){toast(error.message||'فعال‌سازی مجوز انجام نشد.');}
  };
  SYNC.toggleOff = function(){
    if(STATE.meta.sync) STATE.meta.sync.enabled = false; saveState();
    SYNC.disconnect(); toast('همگام‌سازی قطع شد (داده‌های محلی نگه‌دری شد)'); renderSettings();
  };
  SYNC.removeConfig = function(){
    modalConfirm('حذف تنظیمات همگام‌سازی','تنظیمات اتصال حذف شود؟ داده‌های محلی این دستگاه دست‌نخورده باقی می‌مانند.', function(){ SYNC._sessionCredentials = null; STATE.meta.sync = { enabled:false, clinicCode:'', deviceName:'', firebaseConfig:null, lastSyncAt:null, pairedAt:null }; saveState(); SYNC.disconnect(); toast('تنظیمات همگام‌سازی حذف شد'); renderSettings(); });
  };

  window.addEventListener('online',function(){
    const cfg=SYNC.cfg();
    if(cfg&&cfg.enabled&&!connected&&!permissionBlocked){ scheduleReconnect(1200); }
  });
  window.addEventListener('offline',function(){ connected=false; SYNC.renderStatus&&SYNC.renderStatus(); });
  window.DentyarSync = SYNC;
  function autoStart(){ const c=SYNC.cfg(); if(c&&c.enabled){ SYNC.connect(SYNC._sessionCredentials); } }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', autoStart, {once:true});
  else autoStart();
})();
</script>
